# 실행기는 컨테이너 런타임 소켓을 마운트한다. 이 권한은 노드 root 와 동등하므로
# 두 겹으로 가둔다 (docs/07 잔여 위험 R1, 이슈 #47):
#   1. 노드   — nodeSelector/toleration 으로 실행 전용 노드에만 배치
#   2. 네임스페이스 — executor.namespace 를 따로 두면 hostPath 를 허용하는
#      privileged Pod Security 를 그 네임스페이스에만 열 수 있다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codekr-executor
  namespace: {{ include "codekr.executorNamespace" . }}
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.executor.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: executor }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codekr
        app.kubernetes.io/component: executor
    spec:
      {{- include "codekr.imagePullSecrets" . | nindent 6 }}
      {{/*
        **비어 있으면 아예 넣지 않는다.** Helm 은 맵을 병합하므로 값 파일에
        `nodeSelector: {}` 를 적어도 차트 기본값이 지워지지 않는다 — 그러면 라벨이 없는
        클러스터에서 파드가 영영 Pending 으로 남는다(실제로 그랬다).
      */}}
      {{- with .Values.executor.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: executor
          image: {{ include "codekr.image" (dict "root" . "name" "executor") }}
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: EXECUTOR_CONCURRENCY, value: "{{ .Values.executor.concurrency }}" }
            # 기동 전에 방어를 확인한다 (#246). 통과하지 못하면 파드가 뜨지 않는다.
            - { name: EXECUTOR_SELF_TEST_ON_START, value: "{{ .Values.executor.selfTestOnStart }}" }
            {{- if and .Values.executor.runtimeRegistryPlainHTTP .Values.executor.runtimeRegistry }}
            # 클러스터 안 레지스트리는 TLS 가 없다 (#251). 이 호스트에만 적용된다.
            - { name: EXECUTOR_REGISTRY_PLAIN_HTTP, value: "{{ .Values.executor.runtimeRegistry }}" }
            {{- end }}
            - { name: CODEKR_RUNTIMES_PATH, value: /etc/codekr/runtimes.yaml }
            # 엔진 API 클라이언트가 읽는 표준 변수명이다 (제품명이 아니라 규약).
            - { name: DOCKER_HOST, value: "unix://{{ .Values.executor.runtimeSocket }}" }
            - { name: CODEKR_SANDBOX_RUNTIME, value: {{ .Values.executor.sandboxRuntime | quote }} }
            {{- if eq .Values.executor.sandboxRuntime "containerd" }}
            # containerd 구현은 소켓 경로를 이 변수로 받는다 (#68).
            - { name: CONTAINERD_ADDRESS, value: {{ .Values.executor.runtimeSocket | quote }} }
            {{- end }}
            {{- if .Values.executor.usernsHostOffset }}
            # user namespace 재매핑 (#130). containerd 에서만 쓸 수 있다.
            - { name: CODEKR_USERNS_HOST_OFFSET, value: {{ .Values.executor.usernsHostOffset | quote }} }
            {{- end }}
            {{- if .Values.executor.runtimeRegistrySecret }}
            # 런타임 이미지를 받을 때 쓸 자격증명 (#171). 제품명이 아니라 규약인 변수다.
            - { name: DOCKER_CONFIG, value: /etc/codekr/registry }
            {{- end }}
            {{- if .Values.executor.runtimeRegistry }}
            # 런타임 이미지를 자체 레지스트리에서 받는다 (#96).
            - { name: CODEKR_RUNTIME_REGISTRY, value: {{ .Values.executor.runtimeRegistry | quote }} }
            {{- end }}
            {{- if .Values.executor.seccompProfile.enabled }}
            # 좁힌 프로파일 (#48). 파일이 없거나 망가지면 실행기가 기동에서 실패한다
            # — 첫 제출에서 드러나지 않게.
            - { name: CODEKR_SECCOMP_PROFILE, value: /etc/codekr/seccomp/seccomp.json }
            {{- end }}
            # 실행기가 필요로 하는 설정은 큐 주소뿐이다. DB 자격증명은 주지 않는다
            # (ADR-0004) — 그래서 codekr-config 를 통째로 넣지 않는다.
            - { name: CODEKR_REDIS_ADDR, value: {{ include "codekr.redisAddr" . | quote }} }
          volumeMounts:
            - { name: runtimes, mountPath: /etc/codekr }
            {{- if .Values.executor.seccompProfile.enabled }}
            - { name: seccomp, mountPath: /etc/codekr/seccomp }
            {{- end }}
            - { name: runtime-socket, mountPath: {{ .Values.executor.runtimeSocket }} }
            {{- if .Values.executor.runtimeRegistrySecret }}
            - { name: registry-auth, mountPath: /etc/codekr/registry, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.executor.resources | nindent 12 }}
          # 실행기 자신은 root 로 돈다 — 런타임 소켓 접근이 이미 root 와 동등해서
          # 여기서 사용자를 낮춰도 실질적인 이득이 없다. 실제 격리는 실행기가 만드는
          # 샌드박스 컨테이너에 걸린다 (ADR-0003).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # 실행기는 자기 파일시스템에 아무것도 쓰지 않는다. 제출 소스는 소켓 너머의
            # 샌드박스 컨테이너로 바로 들어간다 — 그래서 rootfs 를 잠글 수 있다.
            readOnlyRootFilesystem: true
            # 실행기 자신의 syscall 도 기본 프로파일로 거른다. 샌드박스 컨테이너의
            # 프로파일과는 별개다 (그쪽은 #48).
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: runtimes
          configMap: { name: codekr-runtimes }
        {{- if .Values.executor.seccompProfile.enabled }}
        - name: seccomp
          configMap: { name: codekr-seccomp }
        {{- end }}
        {{- if .Values.executor.runtimeRegistrySecret }}
        - name: registry-auth
          secret:
            secretName: {{ .Values.executor.runtimeRegistrySecret }}
            # dockerconfigjson 시크릿의 키는 .dockerconfigjson 인데, 실행기는
            # config.json 을 찾는다 (DOCKER_CONFIG 규약).
            items:
              - { key: .dockerconfigjson, path: config.json }
        {{- end }}
        - name: runtime-socket
          hostPath:
            path: {{ .Values.executor.runtimeSocket }}
            type: Socket
