apiVersion: apps/v1
kind: Deployment
metadata:
  name: codekr-web
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: web }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codekr
        app.kubernetes.io/component: web
    spec:
      {{- include "codekr.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "codekr.image" (dict "root" . "name" "web") }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # sitemap 이 문제 목록을 받아 올 주소 (#271).
            #
            # **NEXT_PUBLIC_ 이 아니다** — 브라우저는 이 값을 알 필요가 없고, 번들에
            # 들어가면 클러스터 내부 주소가 밖으로 샌다. sitemap 은 요청 시점에
            # 만들어지므로(#234) 이 환경 변수가 실제로 먹는다.
            - name: API_INTERNAL_BASE_URL
              value: http://codekr-api:8080
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "codekr.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: codekr-web
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 3000, targetPort: http }
