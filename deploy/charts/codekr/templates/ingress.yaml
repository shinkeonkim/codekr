{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codekr
  labels: {{- include "codekr.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API 와 WebSocket 을 먼저 매칭하고, 나머지는 웹으로 보낸다.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codekr-api
                port: { name: http }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: codekr-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codekr-web
                port: { name: http }
{{- end }}
