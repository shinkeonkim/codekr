{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codekr
  labels: {{- include "codekr.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    # 공개 주소와 내부 주소가 같은 서비스를 가리킨다. 경로 규칙은 하나로 유지한다 —
    # 둘이 갈라지면 "터널로는 되는데 내부로는 안 되는" 차이가 생긴다.
    {{- range (include "codekr.hosts" . | fromJsonArray) }}
    - host: {{ . }}
      http:
        paths:
          # API 와 WebSocket 을 먼저 매칭하고, 나머지는 웹으로 보낸다.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codekr-api
                port: { name: http }
          # **프로필 배지는 `/api` 밖에 산다** (#475). 남의 README 에 박히는 주소라
          # 짧아야 하고, 우리가 `/api/v1` 을 v2 로 옮길 때 따라 움직이면 안 되기
          # 때문이다. 그런데 여기에 규칙이 없어서 **그 주소는 웹으로 갔고, 기능이
          # 들어온 날부터 계속 404 였다.**
          - path: /badge
            pathType: Prefix
            backend:
              service:
                name: codekr-api
                port: { name: http }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: codekr-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codekr-web
                port: { name: http }
    {{- end }}
{{- end }}
