apiVersion: apps/v1
kind: Deployment
metadata:
  name: codekr-judge
  labels: {{- include "codekr.labels" . | nindent 4 }}
  {{- include "codekr.reloadOnChange" . | nindent 2 }}
spec:
  replicas: {{ .Values.judge.replicas }}
  {{- include "codekr.revisionHistoryLimit" . | nindent 2 }}
  selector:
    matchLabels: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: judge }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codekr
        app.kubernetes.io/component: judge
    spec:
      {{- include "codekr.terminationGrace" . | nindent 6 }}
      {{- include "codekr.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: judge
          image: {{ include "codekr.image" (dict "root" . "name" "judge") }}
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: JUDGE_CONCURRENCY, value: "{{ .Values.judge.concurrency }}" }
            # 차선을 명시한다 (#62). 비워 두면 일반이지만, 적어 두어야
            # 대회 워커와 나란히 놓았을 때 어느 쪽인지 한눈에 보인다.
            - { name: CODEKR_JUDGE_LANE, value: "general" }
          envFrom:
            - configMapRef: { name: codekr-config }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.judge.resources | nindent 12 }}
          # 채점기는 사용자 코드를 직접 실행하지 않고 DB 자격증명도 없다 (ADR-0004).
          securityContext: {{- include "codekr.securityContext" . | nindent 12 }}

{{- if .Values.judge.contest.enabled }}
---
# 대회 제출 전용 채점 워커 (#62).
#
# **일반 워커와 나누는 것이 격리의 전부다.** 등급 순서를 어떻게 정하든 워커 수가
# 유한해서, 같은 워커가 둘을 읽으면 대회 제출이 몰릴 때 평소 제출이 그만큼 밀린다.
#
# 대회가 없을 때도 이 워커는 떠 있다. 큐가 비어 있으면 아무 일도 하지 않으므로
# 비용이 거의 없고, 대회 직전에 띄우는 방식은 그때 실패하면 대회를 망친다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codekr-judge-contest
  labels: {{- include "codekr.labels" . | nindent 4 }}
  {{- include "codekr.reloadOnChange" . | nindent 2 }}
spec:
  replicas: {{ .Values.judge.contest.replicas }}
  {{- include "codekr.revisionHistoryLimit" . | nindent 2 }}
  selector:
    matchLabels: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: judge-contest }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codekr
        app.kubernetes.io/component: judge-contest
    spec:
      {{- include "codekr.terminationGrace" . | nindent 6 }}
      {{- include "codekr.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: judge
          image: {{ include "codekr.image" (dict "root" . "name" "judge") }}
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: JUDGE_CONCURRENCY, value: "{{ .Values.judge.contest.concurrency }}" }
            - { name: CODEKR_JUDGE_LANE, value: "contest" }
          envFrom:
            - configMapRef: { name: codekr-config }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.judge.resources | nindent 12 }}
          securityContext: {{- include "codekr.securityContext" . | nindent 12 }}
{{- end }}
