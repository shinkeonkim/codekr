# 큐와 실시간 이벤트용 Redis. 단일 인스턴스다 — 지금 규모에서 복제는 과잉이고,
# 큐가 비어도 채점은 다시 요청하면 되므로 데이터 손실의 영향이 제한적이다 (ADR-0002).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: codekr-redis
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  serviceName: codekr-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codekr
        app.kubernetes.io/component: redis
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--save", ""]
          ports:
            - { name: redis, containerPort: 6379 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: codekr-redis
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
