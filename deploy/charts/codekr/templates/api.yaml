apiVersion: apps/v1
kind: Deployment
metadata:
  name: codekr-api
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  {{- include "codekr.revisionHistoryLimit" . | nindent 2 }}
  selector:
    matchLabels: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codekr
        app.kubernetes.io/component: api
    spec:
      {{- include "codekr.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: codekr-api
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: {{ include "codekr.image" (dict "root" . "name" "api") }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: codekr-config }
            - secretRef: { name: {{ .Values.postgres.secretName }} }
            {{- if and .Values.mail.host (ne .Values.mail.secretName .Values.postgres.secretName) }}
            # 메일 자격증명 (#355). 기본은 postgres 와 같은 `codekr-secrets` 라
            # 위에서 이미 붙는다 — 다른 시크릿을 쓸 때만 하나 더 건다.
            - secretRef: { name: {{ .Values.mail.secretName }} }
            {{- end }}
          {{- if .Values.storage.endpoint }}
          # 스토리지 자격증명 (#115, #424). 차트에 두지 않고 시크릿에서 읽는다 —
          # values.yaml 은 저장소에 남는다.
          #
          # **`envFrom` 이 아니라 이름을 하나씩 잇는다.** `envFrom` 은 시크릿의 키를
          # 그대로 환경변수 이름으로 쓰는데, 이 시크릿의 키는 `accessKey`/`secretKey` 다
          # — 앱이 읽는 `CODEKR_STORAGE_*` 와 다르다. 그래서 자격증명이 비어 있는 채로
          # 떴고, 업로드가 조용히 아무 일도 안 했다 (#424).
          #
          # **키 이름을 바꿀 수는 없다.** 같은 시크릿을 MinIO 가 자기 이름으로 읽는다
          # (`MINIO_ROOT_USER` ← `accessKey`). 맞추는 쪽은 여기다.
          env:
            - name: CODEKR_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.storage.secretName }}, key: accessKey }
            - name: CODEKR_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.storage.secretName }}, key: secretKey }
          {{- end }}
          volumeMounts:
            - { name: runtimes, mountPath: /etc/codekr }
            - { name: tmp, mountPath: /tmp }
          # 기동 중 Flyway 마이그레이션이 도는 동안 죽이지 않도록 startup 을 따로 둔다.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "codekr.securityContext" . | nindent 12 }}
      volumes:
        - name: runtimes
          configMap: { name: codekr-runtimes }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codekr-api
  labels: {{- include "codekr.labels" . | nindent 4 }}
    # ServiceMonitor 가 이 Service 를 **라벨로** 고른다 (#677). 이름으로는 못 고른다.
    app.kubernetes.io/component: api
spec:
  selector: { app.kubernetes.io/name: codekr, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 8080, targetPort: http }
