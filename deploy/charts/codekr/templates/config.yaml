apiVersion: v1
kind: ConfigMap
metadata:
  name: codekr-config
  labels: {{- include "codekr.labels" . | nindent 4 }}
data:
  {{- if .Values.storage.endpoint }}
  # 오브젝트 스토리지 (#115). 자격증명은 시크릿에서 온다.
  CODEKR_STORAGE_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  CODEKR_STORAGE_BUCKET: {{ .Values.storage.bucket | quote }}
  {{- end }}
  {{- if .Values.mail.host }}
  # 메일 (#355). **자격증명은 여기 없다** — 시크릿에서 온다.
  CODEKR_MAIL_HOST: {{ .Values.mail.host | quote }}
  CODEKR_MAIL_PORT: {{ .Values.mail.port | quote }}
  CODEKR_MAIL_SSL: {{ .Values.mail.ssl | quote }}
  CODEKR_MAIL_FROM: {{ .Values.mail.from | quote }}
  {{- end }}
  # 메일 본문의 링크가 가리킬 곳. 사람이 눈으로 보는 주소라 정본 표기를 따른다 (ADR-0009).
  CODEKR_SITE_URL: "https://{{ .Values.ingress.publicHost }}"
  CODEKR_DB_URL: "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  CODEKR_REDIS_HOST: "codekr-redis.{{ .Release.Namespace }}.svc.cluster.local"
  CODEKR_REDIS_PORT: "6379"
  CODEKR_REDIS_ADDR: {{ include "codekr.redisAddr" . | quote }}
  # 공개 주소와 내부 주소 모두 허용한다. 하나만 넣으면 다른 쪽으로 들어온 사용자의
  # 브라우저가 API 호출을 막는다.
  CODEKR_CORS_ALLOWED_ORIGINS: >-
    {{- $origins := list }}
    {{- range (include "codekr.hosts" . | fromJsonArray) }}
    {{- $origins = append $origins (printf "https://%s" .) }}
    {{- end }}
    {{ join "," $origins }}
  # 실행기가 조정할 수 있는 범위 (#40)
  CODEKR_EXECUTOR_DEPLOYMENT: "codekr-executor"
  CODEKR_EXECUTOR_NAMESPACE: {{ include "codekr.executorNamespace" . | quote }}
  CODEKR_EXECUTOR_MIN_REPLICAS: "{{ .Values.executor.minReplicas }}"
  CODEKR_EXECUTOR_MAX_REPLICAS: "{{ .Values.executor.maxReplicas }}"
{{/*
런타임 정의는 api 와 실행기가 함께 읽는다 (ADR-0003). ConfigMap 은 네임스페이스에
묶이므로, 실행기를 따로 떼어 놓았으면 그 네임스페이스에도 같은 내용을 만든다.
*/}}
{{- range (list .Release.Namespace (include "codekr.executorNamespace" .)) | uniq }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codekr-runtimes
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: codekr
data:
  # **files/runtimes.yaml 은 infra/runtimes/runtimes.yaml 로 가는 심볼릭 링크다.**
  # 전에는 사본이었고, 실제로 갈라졌다 — 이미지 이름을 바꾼 뒤(#171) 차트 쪽 사본이
  # 옛 주소를 들고 있어 배포된 실행기가 없는 이미지를 받으려 했다.
  runtimes.yaml: |
{{ $.Files.Get "files/runtimes.yaml" | indent 4 }}
{{- end }}

---
# 샌드박스 컨테이너에 걸 seccomp 프로파일 (#48).
#
# **파드 스펙(`securityContext.seccompProfile`)이 아니라 ConfigMap 이다.** 이 프로파일은
# 실행기 파드가 아니라 실행기가 **만드는** 컨테이너에 걸린다 — 쿠버네티스는 그 컨테이너를
# 모르므로 파드 스펙으로는 닿지 않는다. 실행기가 파일을 읽어 런타임 API 로 넘긴다.
#
# 노드 설정(`/etc/containerd/...`)에 두지 않은 이유: 노드를 늘릴 때마다 사람이 파일을
# 복사해야 하고, 프로파일과 코드의 버전이 갈라져도 아무도 모른다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codekr-seccomp
  namespace: {{ include "codekr.executorNamespace" . }}
  labels: {{- include "codekr.labels" . | nindent 4 }}
data:
  seccomp.json: |
{{ .Files.Get "files/seccomp.json" | indent 4 }}
