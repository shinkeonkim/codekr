{{- if .Values.backup.offsite.enabled }}
{{/*
  백업을 **클러스터 밖으로** 한 벌 더 보낸다 (#281).

  NFS 한 곳만으로는 "클러스터가 무너져도 남는다" 를 지키지 못한다 — 그 NAS 가 죽으면
  백업도 같이 죽는다. 같은 집 안에 있는 디스크다.

  **어디로 보낼지는 이 저장소가 정하지 않는다.** 집 밖에 두는 것은 비용과 *사용자
  데이터를 집 밖으로 내보내는 판단*이 함께 오는 일이라, 기본은 꺼짐이고 목적지는
  값으로 받는다. 켜는 순간 그 판단을 한 것이다.

  `mc mirror --overwrite --remove` 를 쓰지 않는다 — 원본에서 지워진 것이 사본에서도
  지워지면 **사본을 두는 뜻이 절반 사라진다.** 보존 기간은 목적지 쪽 수명 규칙으로 둔다.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: codekr-db-backup-offsite
  labels: {{- include "codekr.labels" . | nindent 4 }}
spec:
  # 덤프가 끝난 뒤에 돈다. 같은 시각에 돌면 반쯤 쓰인 파일을 보낼 수 있다.
  schedule: {{ .Values.backup.offsite.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: { app.kubernetes.io/name: codekr-db-backup-offsite }
        spec:
          restartPolicy: Never
          containers:
            - name: mirror
              image: {{ .Values.backup.offsite.image }}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  mc alias set offsite "$ENDPOINT" "$ACCESS_KEY" "$SECRET_KEY"
                  # **지우지 않는다.** 원본에서 사라진 것을 사본에서도 지우면 사본의 뜻이 준다.
                  mc mirror --overwrite /dumps "offsite/$BUCKET/dumps"
                  mc ls "offsite/$BUCKET/dumps" | tail -5
              env:
                - name: ENDPOINT
                  value: {{ .Values.backup.offsite.endpoint | quote }}
                - name: BUCKET
                  value: {{ .Values.backup.offsite.bucket | quote }}
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.offsite.secretName }}
                      key: ACCESS_KEY
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.offsite.secretName }}
                      key: SECRET_KEY
              volumeMounts:
                - { name: dumps, mountPath: /dumps, readOnly: true }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: dumps
              persistentVolumeClaim: { claimName: codekr-db-dumps }
{{- end }}
