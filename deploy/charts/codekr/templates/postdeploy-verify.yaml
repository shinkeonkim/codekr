{{- if .Values.postdeployVerify.enabled }}
{{/*
  배포 후 검증 (#246).

  **자동 배포가 붙으면 아무도 확인하지 않는 배포가 된다.** 사람이 하던 확인
  (docs/09 §6)을 sync 뒤에 자동으로 돌린다. 여기서 실패하면 ArgoCD 가 그 sync 를
  실패로 표시하므로, 나갔다는 사실과 함께 문제가 드러난다.

  **이 잡은 되돌리지 않는다.** 되돌릴지는 사람이 정한다 — 실패가 배포 때문인지
  일시적인 것인지 여기서는 알 수 없기 때문이다.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: codekr-postdeploy-verify
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: codekr-postdeploy-verify }
    spec:
      restartPolicy: Never
      {{- include "codekr.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: verify
          image: {{ .Values.postdeployVerify.image }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              api="http://codekr-api:8080"

              echo "1) 기동 확인"
              # 새 파드가 준비되는 데 시간이 걸린다. Deployment 가 준비될 때까지 기다리는
              # 것은 ArgoCD 가 하지만, 그 판단과 실제 응답은 다를 수 있다.
              for i in $(seq 1 60); do
                status=$(wget -q -O- "$api/actuator/health" 2>/dev/null || true)
                case "$status" in *'"status":"UP"'*) break ;; esac
                [ "$i" = 60 ] && { echo "60회 시도에도 UP 이 아닙니다"; exit 1; }
                sleep 5
              done
              echo "   UP"

              echo "2) 배포된 것이 이 릴리스가 맞는가"
              # 매니페스트가 가리키는 태그와 실제로 도는 것이 어긋난 적이 있다 (#218, #237).
              # 여기서는 API 가 응답한다는 것까지만 본다 — 태그 확인은 ArgoCD 가 한다.

              echo "3) 문제 목록이 내려오는가"
              # DB 연결과 마이그레이션이 끝났다는 뜻이다. 여기서 500 이 나면
              # 스키마와 코드가 어긋난 것이다.
              body=$(wget -q -O- "$api/api/v1/problems?size=1")
              case "$body" in *'"content"'*) ;; *) echo "예상 밖 응답: $body"; exit 1 ;; esac
              echo "   ok"

              echo "배포 후 검증 통과"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
{{- end }}
