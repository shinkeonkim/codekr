{{- if .Values.predeployDump.enabled }}
{{/*
  배포 직전 DB 덤프 (#246).

  **매니페스트를 되돌려도 스키마는 되돌아오지 않는다.** Flyway 는 앞으로만 가고
  커뮤니티 판에는 undo 가 없다. 그래서 되돌릴 지점을 배포 **전에** 만들어 둔다.

  ArgoCD PreSync 훅인 이유: CI 가 클러스터에 닿지 않아도 된다. 배포를 일으키는 것은
  git 커밋 하나이고, 그 커밋이 적용되기 직전에 클러스터 안에서 덤프가 돈다.

  **자동으로 복원하지는 않는다.** 복원은 그 사이에 쌓인 사용자 데이터를 지우는 일이라
  사람이 판단해야 한다. 절차는 docs/09 §7 에 있다.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codekr-db-dumps
  annotations:
    # **훅이 아니라 일반 리소스다** (#254). 훅으로 두었더니 수명이 sync 작업에 묶여
    # 삭제 대상이 됐고, 완료된 덤프 파드가 그것을 잡고 있어 삭제가 끝나지 않았다.
    # 그 뒤로는 모든 sync 가 "삭제 중인 객체에 finalizer 를 붙일 수 없다" 로 실패했다.
    # **배포를 되돌릴 지점을 만들려던 것이 배포를 막았다.**
    #
    # 순서는 물결로 잡는다 — 훅 없이도 앱(기본 0)보다 먼저 만들어진다.
    argocd.argoproj.io/sync-wave: "-3"
    # 덤프는 앱보다 오래 살아야 한다. 차트를 지워도 남긴다.
    argocd.argoproj.io/sync-options: Delete=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  # 데이터 디렉터리는 Longhorn 이지만 **백업은 NFS 로 보낸다** — 용량이 그쪽에 있고,
  # 클러스터가 무너져도 파일이 클러스터 밖에 남는다.
  storageClassName: {{ .Values.predeployDump.storageClass }}
  resources:
    requests:
      storage: {{ .Values.predeployDump.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # **이름에 릴리스가 들어간다** (#254). 잡의 spec 은 바꿀 수 없으므로, 일반 리소스로
  # 두려면 릴리스마다 다른 이름이어야 한다. 덤으로 "릴리스당 한 번" 이 셸 조건문이
  # 아니라 구조로 보장된다 — 같은 릴리스를 다시 sync 하면 같은 잡이라 다시 돌지 않는다.
  # 앞 릴리스의 잡은 ArgoCD 가 prune 으로 걷어 간다.
  name: codekr-db-predeploy-dump-{{ .Values.global.imageTag | trunc 12 | trimSuffix "-" }}
  annotations:
    # PVC(-3) 가 Bound 된 뒤, 앱(0) 보다 먼저.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # 덤프가 실패하면 배포도 멈춘다 — 되돌릴 지점 없이 스키마를 바꾸지 않는다.
  backoffLimit: 1
  # 끝난 잡과 그 파드는 스스로 사라진다 (#320). 하루를 두는 이유는 **배포가 잘못됐을
  # 때 덤프 로그를 보는 창**이 그만큼은 있어야 하기 때문이다 — 검증 잡과 같은 값이다.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: codekr-db-predeploy-dump }
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
      containers:
        - name: dump
          # 서버와 같은 이미지를 쓴다. pg_dump 는 자기보다 새 서버를 덤프하지 못한다.
          image: {{ .Values.predeployDump.image }}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              target="/dumps/${RELEASE_TAG}.dump"

              # **처음 설치할 때는 DB 가 아직 없다** (#250). CNPG Cluster 는 Sync 단계에서
              # 만들어지는데 이 훅은 그보다 먼저 돈다. 그때는 되돌릴 데이터도 없으므로
              # 막지 않고 넘어간다 — 실패로 두면 첫 설치가 영영 끝나지 않는다.
              if ! pg_isready --timeout=10 >/dev/null 2>&1; then
                echo "DB 에 닿지 못했습니다 ($PGHOST). 첫 설치로 보고 건너뜁니다."
                exit 0
              fi

              # **같은 배포를 다시 sync 해도 덤프는 한 번뿐이다.** selfHeal 로 sync 가
              # 자주 도는데 그때마다 뜨면 디스크만 찬다. 되돌릴 지점은 "그 배포 직전"
              # 하나면 된다.
              if [ -f "$target" ]; then
                echo "이미 있는 덤프입니다: $target"
                exit 0
              fi

              echo "덤프 시작: $target"
              pg_dump --format=custom --no-owner --no-privileges --file="${target}.partial"
              # 다 쓴 뒤에 이름을 바꾼다 — 중간에 죽은 파일이 온전한 덤프로 보이면 안 된다.
              mv "${target}.partial" "$target"
              ls -lh "$target"

              # 오래된 덤프를 지운다. 남길 개수는 values 로 정한다.
              cd /dumps
              ls -1t *.dump 2>/dev/null | tail -n +$((KEEP + 1)) | xargs -r rm -v --
          env:
            - name: RELEASE_TAG
              # 배포 태그가 곧 덤프 이름이다. 어느 배포 직전 상태인지가 이름에 드러난다.
              value: {{ .Values.global.imageTag | quote }}
            - name: KEEP
              value: {{ .Values.predeployDump.keep | quote }}
            - name: PGHOST
              value: {{ .Values.postgres.host }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database }}
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: CODEKR_DB_USERNAME }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: CODEKR_DB_PASSWORD }
          volumeMounts:
            - { name: dumps, mountPath: /dumps }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: dumps
          persistentVolumeClaim: { claimName: codekr-db-dumps }
{{- end }}
