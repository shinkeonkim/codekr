# 코드.kr 기본 값. 홈랩 전용 오버라이드는 oh-my-homelab 의 helm-charts/values/codekr.yaml 에 있다.

global:
  # CI(.github/workflows/ci.yml)가 여기로 이미지를 올린다.
  registry: ghcr.io/shinkeonkim
  imageTag: latest
  domainSuffix: homelab.shinkeonkim.com
  # 비공개 레지스트리에서 받을 때만 필요하다. 저장소가 비공개면 ghcr 패키지도
  # 기본이 비공개라서 이 시크릿이 없으면 ImagePullBackOff 로 멈춘다.
  imagePullSecrets: []

ingress:
  enabled: true
  className: traefik
  # 사용자에게 보이는 주소. Cloudflare Tunnel 의 public hostname 이 이 이름으로 붙는다.
  #
  # 퓨니코드로 적는 이유: Ingress 의 host 와 CORS 의 Origin 은 아스키만 받는다.
  # 브라우저는 주소창에 코드.kr 을 보여주지만 실제로 보내는 Host/Origin 헤더는 이 값이다.
  publicHost: xn--hy1by51c.kr # 코드.kr
  # 내부 관리용 주소 (Traefik + Tailscale). 터널을 거치지 않고 접근할 때 쓴다.
  internalHost: codekr.homelab.shinkeonkim.com
  annotations: {}

api:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

# 사용자가 올린 이미지를 두는 곳 (#115).
#
# **자격증명은 차트에 두지 않는다.** 시크릿에서 읽는다 — values.yaml 은 저장소에 남는다.
storage:
  # 홈랩에 띄운 MinIO 의 주소 (#115). 비우면 업로드가 503 이 되고 나머지 기능은 그대로 돈다.
  #
  # **AWS S3 를 쓰지 않는다.** MinIO 가 S3 프로토콜을 말하므로 표준 클라이언트를 그대로
  # 쓸 뿐이다. 예: http://minio.storage.svc.cluster.local:9000
  endpoint: ""
  bucket: codekr
  # 자격증명이 든 시크릿 이름. 키는 accessKey / secretKey.
  secretName: codekr-storage

judge:
  # 실행기와 같다 — 처음 만들 때의 값이다 (#418, ADR-0011).
  replicas: 1
  concurrency: 4
  # 대회 제출 전용 워커 (#62). 일반 워커와 나누는 것이 격리의 전부다 —
  # 같은 워커가 둘을 읽으면 대회 제출이 몰릴 때 평소 제출이 그만큼 밀린다.
  #
  # 대회가 없어도 띄워 둔다. 큐가 비면 아무 일도 하지 않아 비용이 거의 없고,
  # 대회 직전에 띄우는 방식은 그때 실패하면 대회를 망친다.
  contest:
    enabled: true
    replicas: 1
    concurrency: 4
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

executor:
  # **처음 만들 때의 값이다** (#418, ADR-0011). 그 뒤로는 어드민 화면이 파드 수의 주인이고
  # ArgoCD 는 `spec.replicas` 를 보지 않는다 — 배포 저장소의 `ignoreDifferences` 가 그것을
  # 정한다. 여기를 고쳐도 이미 돌고 있는 클러스터의 파드 수는 바뀌지 않는다.
  replicas: 2
  concurrency: 4
  # 실행기는 컨테이너 런타임 소켓을 쓴다. 이 권한은 노드 root 와 동등하므로
  # 반드시 실행 전용 노드에만 배치한다 (docs/07 의 잔여 위험 R1, 이슈 #47).
  nodeSelector:
    codekr/workload: executor
  tolerations:
    - key: codekr/executor
      operator: Exists
      effect: NoSchedule
  # 런타임 이미지를 받아올 레지스트리 (#96). 비우면 정의 파일의 주소(Docker Hub)에서 받는다.
  #
  # 미러를 쓰면 pull rate limit·속도·가용성 문제가 함께 풀리지만, **가장 큰 이유는
  # 공급망**이다 — 태그는 다시 붙을 수 있어서, 우리가 검증한 것과 다른 것이 실행 노드에
  # 들어갈 수 있다. runtimes.yaml 의 digest 와 함께 써야 그 문제가 막힌다.
  runtimeRegistry: ""
  # 그 레지스트리를 **평문 HTTP 로** 부를지 (#251).
  #
  # 클러스터 안의 레지스트리는 TLS 를 걸지 않는 것이 보통이다 — 트래픽이 노드 밖으로
  # 나가지 않고, 바깥에서 오는 길은 인그레스가 TLS 를 맡는다. 그런데 바깥 주소를 쓰면
  # 클러스터 안에서 인터넷을 한 바퀴 돌아 다시 들어온다(공인 DNS 가 CDN 을 가리킨다).
  #
  # 켜면 위 `runtimeRegistry` 호스트에만 적용된다. 다른 곳은 그대로 TLS 다.
  runtimeRegistryPlainHTTP: false
  # 그 레지스트리로 나가는 길을 연다 (#251).
  #
  # 실행기의 egress 는 기본이 "DNS 와 채점 큐뿐" 이다. 레지스트리 규칙이 없으면
  # **노드에 미리 받아 둔 이미지로만 채점이 된다** — 그리고 그 사실이 채점을 실제로
  # 해 보기 전까지 드러나지 않는다.
  #
  # namespace 를 비우면 규칙을 만들지 않는다(바깥 레지스트리를 쓰는 환경).
  runtimeRegistryEgress:
    namespace: ""
    port: 5000
  # 기동할 때 샌드박스 방어를 확인하고 나서 서비스한다 (#246).
  #
  # **자동 배포에는 사람이 `--self-test` 를 돌려 보는 단계가 없다.** 그래서 그 확인을
  # 기동에 붙인다 — 통과하지 못하면 파드가 뜨지 않고, 배포는 눈에 띄게 실패하며,
  # 앞 버전이 계속 돈다. 뚫린 채로 채점을 받는 것보다 낫다.
  #
  # 대신 기동이 몇 초 늦고, 검사용 런타임 이미지를 받아야 한다.
  selfTestOnStart: true
  # 런타임 소켓 경로. containerd 노드 기준.
  runtimeSocket: /run/containerd/containerd.sock
  # containerd 로 명령을 돌릴 때 쓰는 FIFO 를 둘 **노드 위의** 경로 (#256).
  #
  # **파드 안 경로로는 안 된다.** FIFO 는 실행기(클라이언트)와 containerd shim(호스트)이
  # 함께 여는 파일이라, 양쪽이 같은 경로에서 같은 것을 봐야 한다. emptyDir 은 호스트에서
  # 보이지 않고, 기본값(/run/containerd/fifo)은 소켓을 쓰려고 읽기 전용으로 마운트한
  # 자리라 만들 수 없다 — 파드로 띄웠을 때만 드러나는 차이다.
  #
  # 비우면 설정하지 않는다(노드 위에서 그냥 돌리는 로컬·CI 경로).
  fifoHostPath: /run/codekr/fifo
  # 샌드박스 구현. engine-api 또는 containerd (#68).
  # 값이 틀리면 실행기가 기동에서 실패한다 — 첫 제출에서 드러나지 않게.
  #
  # 운영 노드는 containerd 를 쓴다. engine-api 는 로컬 개발용이다 (ADR-0003).
  sandboxRuntime: engine-api
  # user namespace 재매핑 (#130, docs/07 R3). containerd 에서만 쓸 수 있다.
  #
  # 호스트에서 내줄 UID 구간의 시작이다. 컨테이너의 0~65535 가 이 값부터 65536 개에
  # 겹쳐진다. **켜기 전에 그 구간을 /etc/subuid·/etc/subgid 로 예약한다** — 실제 계정이
  # 쓰는 구간과 겹치면 재매핑이 오히려 권한을 주는 셈이 된다.
  #
  # 비우면 켜지 않는다. engine-api 에 값을 주면 기동에서 실패한다.
  usernsHostOffset: ""
  # 비공개 레지스트리에서 런타임 이미지를 받을 때 쓸 시크릿 (#171).
  #
  # 파드 이미지용 imagePullSecrets 와는 **다르다.** 그쪽은 kubelet 이 쓰고 실행기에게는
  # 보이지 않는다 — 실행기는 런타임 이미지를 자기가 직접 받으므로 자기 몫이 필요하다.
  #
  # kubernetes.io/dockerconfigjson 형식의 시크릿 이름을 준다. 비우면 익명으로 받는다.
  runtimeRegistrySecret: ""
  # 실행기만 다른 네임스페이스에 둘 수 있다. hostPath 마운트 때문에 그 네임스페이스는
  # Pod Security 를 privileged 로 열어야 하는데, 나머지 워크로드까지 함께 열리지 않게
  # 분리한다. 비워 두면 릴리스 네임스페이스에 함께 배치된다.
  namespace: ""
  # 샌드박스 컨테이너에 걸 좁힌 seccomp 프로파일 (#48).
  # 끄면 런타임 기본 프로파일로 돈다 — **끄는 것과 unconfined 는 다르다.**
  seccompProfile:
    enabled: true
  # 침해된 실행기가 밖으로 나가는 경로를 DNS·Redis 로만 좁힌다 (#47).
  # CNI 가 NetworkPolicy 를 지원하지 않으면 이 객체는 조용히 무시되므로,
  # **끌 수 있게 두되 기본은 켜 둔다** — 보안 통제의 기본값은 켜짐이어야 한다.
  networkPolicy:
    enabled: true
  # 어드민 스케일 제어(#40)가 조정할 수 있는 범위.
  minReplicas: 1
  maxReplicas: 20
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }

# 채점기·실행기가 종료 신호를 받은 뒤 **하던 일을 마치는 데 쓰는 시간** (#415).
#
# 파드의 `terminationGracePeriodSeconds` 는 여기에 30초를 더해 만든다 — 프로세스가
# 쓰는 시간보다 파드가 기다리는 시간이 길어야 한다. 배포가 그만큼 느려지므로
# **채점 한 건의 최대 시간**을 넘겨 잡을 이유는 없다.
workers:
  drainSeconds: 90

# 어드민이 조정할 수 있는 워크로드 (#40, #390, #431).
#
# **차트와 앱이 같은 목록을 봐야 한다.** 전에는 앱의 `application.yml` 이 셋을 들고
# 차트는 실행기 하나만 알아서, RBAC 이 빠진 채 배포되고 채점기가 403 을 냈다.
# 이 목록이 Role·RoleBinding 과 ConfigMap 을 함께 만든다.
#
# `namespace` 를 비우면 릴리스 네임스페이스다. 실행기만 예외로 `executor.namespace`
# 를 따른다 — **예외가 기본을 정하지 않게** 그 예외를 여기 한 줄로 못 박는다.
scaling:
  targets:
    - name: executor
      deployment: codekr-executor
      namespace: ""
    - name: judge
      deployment: codekr-judge
      namespace: ""
      minReplicas: 1
      maxReplicas: 10
    - name: judge-contest
      deployment: codekr-judge-contest
      namespace: ""
      minReplicas: 1
      maxReplicas: 10

redis:
  storage: 2Gi
  # 비우면 클러스터 기본 StorageClass 를 쓴다.
  #
  # **비워 두면 ArgoCD 가 매번 차이를 본다** (#252) — 서버가 실제로 쓴 이름을 채워
  # 넣기 때문이다. 클러스터의 기본 이름을 여기 적으면 그 차이가 사라진다.
  # 기본값을 비워 두는 이유는 그 이름이 클러스터마다 다르기 때문이다.
  storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# 메일 발송 (#233, #355).
#
# ⚠️ **이 저장소는 public 이다.** 여기에는 **시크릿 이름만** 적는다 —
# 사용자 이름과 앱 비밀번호는 SOPS 로 암호화한 `codekr-secrets` 에 넣는다
# (`CODEKR_MAIL_USERNAME`, `CODEKR_MAIL_PASSWORD`). `storage`·`postgres` 가
# 이미 같은 패턴이다.
#
# **host 가 비면 이메일 인증이 통째로 꺼진 채 뜬다** — 보낼 수 없으면 요구하지도
# 않는 것이 규칙이라(#115), 사고가 아니라 설계다. 켜려면 host 를 준다.
mail:
  host: ""
  # Daum 스마트워크는 465/SSL 이다. 587 을 쓰면 ssl 을 끈다.
  port: 465
  ssl: true
  # **인증 계정과 같은 주소여야 한다.** 다르면 제공자가 거부하거나 스팸함으로 간다.
  from: ""
  secretName: codekr-secrets

# 문제 초안 만들기 (#230, #647).
#
# **스위치는 하나다: 키가 있으면 켜지고 없으면 없는 기능이다.** 앱이 그렇게 되어 있고
# (`enabled = apiKey.isNotBlank()`), 차트에 별도의 `enabled` 를 두면 스위치가 둘이 되어
# **"차트에서는 껐는데 켜져 있다"** 가 가능해진다. 저장소(#115)·메일(#355)과 같은 규칙이다.
#
# 키는 `codekr-secrets` 안에 `CODEKR_DRAFT_API_KEY` 로 둔다 — api 가 그 시크릿을
# `envFrom` 으로 통째로 받으므로 여기 적을 것이 없다. **값은 SOPS 에만 있다**
# (이 저장소는 public 이다, #424).
#
# 아래 둘은 키가 없어도 무해하다 — 부를 일이 없기 때문이다.
# `baseUrl` 을 OpenAI 가 아닌 곳으로 돌리면 제공자가 바뀐다. LiteLLM 프록시(#648)를
# 세우면 그 주소를 여기 적고, **api 는 그때도 고치지 않는다.**
# 모델 제공자 앞에 서는 프록시 (#648, #649).
#
# **기본은 꺼짐이다.** 켜면 `problemDraft.baseUrl` 을 아래 서비스로 돌린다 —
# api 는 그때도 고치지 않는다.
#
#   problemDraft:
#     baseUrl: http://codekr-litellm:4000/v1
#     model: 문제-초안                       ← 모델 이름이 아니라 일 이름
#   그리고 시크릿의 `CODEKR_DRAFT_API_KEY` 를 프록시의 master key 와 같은 값으로.
litellm:
  enabled: false
  # **태그를 고정한다.** `main-stable` 은 다시 붙는 이름이라, 같은 매니페스트가
  # 어제와 다른 것을 띄울 수 있다 (#96 이 런타임 이미지에서 겪은 것과 같은 이유).
  image: ghcr.io/berriai/litellm:main-v1.77.3-stable
  secretName: codekr-secrets
  # 시크릿에서 찾을 제공자 키 이름들. **없으면 그 제공자만 실패하고 폴백이 넘어간다** —
  # 하나만 쓰는 사람이 나머지까지 넣어야 파드가 뜨는 것은 과하다.
  providerSecretKeys:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
  # **예산과 모델 목록은 여기 없다** — `infra/litellm/config.yaml` 이 그것을 정하고,
  # 차트는 그 파일을 링크로 담아 나른다. 로컬과 운영이 같은 파일을 쓴다.
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

problemDraft:
  baseUrl: https://api.openai.com/v1
  # **모델 이름이 아니라 일 이름으로 두는 편이 낫다** (#648). 프록시가 서면 여기가
  # `문제-초안` 이 되고, 모델을 바꿔도 이 값은 그대로다.
  model: gpt-4o-mini

postgres:
  # CNPG 오퍼레이터가 만든 클러스터를 쓴다 (홈랩 인프라 쪽에서 정의).
  host: codekr-db-rw
  port: 5432
  database: codekr
  # 자격증명은 SOPS 시크릿에서 온다.
  secretName: codekr-secrets

# 배포 직전 DB 덤프 (#246).
#
# **되돌릴 지점이 없으면 되돌릴 수 없다.** 매니페스트를 되돌리면 이미지는 돌아오지만
# 스키마는 돌아오지 않는다 — Flyway 는 앞으로만 가고 undo 가 없다.
predeployDump:
  enabled: true
  # 서버와 같은 이미지. pg_dump 는 자기보다 새 서버를 덤프하지 못한다.
  image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  # 데이터는 Longhorn 이지만 백업은 NFS 로 보낸다 — 용량이 그쪽에 있고,
  # 클러스터가 무너져도 파일이 클러스터 밖에 남는다.
  storageClass: nfs-mac
  size: 5Gi
  # 남길 덤프 개수. 되돌리는 대상은 보통 직전 한두 배포다.
  keep: 10

# 하루 한 번 논리 백업 (#281).
#
# **배포 직전 덤프(predeployDump)와 다른 물건이다.** 그쪽은 "이 배포 직전으로",
# 이쪽은 "어제로" 돌아갈 지점이다. 전에는 백업이 뜨는 유일한 계기가 배포였고,
# 그래서 **RPO 가 배포 주기에 묶여 있었다.**
#
# 같은 PVC(`codekr-db-dumps`)를 쓴다 — 용량은 `predeployDump.size` 하나로 관리한다.
backup:
  enabled: true
  # **이 시각이 곧 최악의 RPO 다.** 백업 직전에 잃으면 24시간을 잃는다.
  # 새벽 4시(KST)는 제출이 가장 적은 때다.
  schedule: "0 4 * * *"
  timeZone: Asia/Seoul
  # 남길 정기 백업 개수. 14일치다.
  keep: 14
  # **이보다 작으면 백업으로 보지 않는다.** pg_dump 는 붙기만 하면 0 으로 끝나므로,
  # 크기를 보지 않으면 0바이트 파일이 매일 쌓이고 아무도 모른다.
  minBytes: 4096
  # **두 번째 사본** (#281). NFS 한 대가 죽으면 백업도 같이 죽는다.
  #
  # MinIO(#115)가 이미 있어 S3 프로토콜을 그대로 쓴다. **다만 그것도 같은 집 안에 있다** —
  # "클러스터가 무너져도" 까지 지키려면 집 밖에 하나 더 두어야 하고, 그것은 비용과
  # 사용자 데이터를 밖으로 내보내는 판단이 함께 온다 (docs/09 §5.2).
  #
  # 자격증명이 없으면 켜 봐야 매일 실패한다. **기본은 꺼짐**이고, 켜는 것이 명시적인
  # 선택이어야 한다.
  objectStore:
    enabled: false
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    endpoint: ""
    bucket: codekr-db-dumps
    secretName: codekr-storage
    accessKeyKey: CODEKR_STORAGE_ACCESS_KEY
    secretKeyKey: CODEKR_STORAGE_SECRET_KEY

  # 백업이 조용히 멈추는 것을 알아채는 규칙 (#281).
  #
  # **기본은 꺼짐** — Prometheus Operator 가 없는 클러스터에서는 이 CR 이 뜨지 않는다.
  # 켜면 "26시간 넘게 성공 없음" 과 "잡 실패" 가 알림이 된다.
  alerts:
    enabled: false
    # 클러스터의 Prometheus 가 규칙을 고르는 라벨. 그쪽 설정에 맞춘다.
    labels: {}

  # 클러스터 밖으로 한 벌 더 (#281).
  #
  # **기본은 꺼짐.** 집 밖에 두는 것은 비용과 *사용자 데이터를 집 밖으로 내보내는
  # 판단*이 함께 온다 — 켜는 순간 그 판단을 한 것이다. 목적지는 S3 를 말하는 곳이면
  # 어디든 된다 (MinIO·S3·R2). 다만 **같은 홈랩 안의 MinIO 는 "클러스터가 무너져도"
  # 를 지키지 못한다** (docs/09 §5.2).
  offsite:
    enabled: false
    # 덤프가 끝난 뒤에 돈다. 같은 시각이면 반쯤 쓰인 파일을 보낼 수 있다.
    schedule: "30 4 * * *"
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    endpoint: ""
    bucket: ""
    # ACCESS_KEY·SECRET_KEY 를 담은 시크릿. **차트가 만들지 않는다** (#115 와 같은 규칙).
    secretName: codekr-backup-offsite

# 배포 후 검증 (#246).
#
# 자동 배포가 붙으면 아무도 확인하지 않는 배포가 된다. 사람이 하던 확인을 sync 뒤에
# 자동으로 돌린다.
postdeployVerify:
  enabled: true
  # wget 만 있으면 된다. 앱 이미지를 쓰지 않는 이유는 검증이 앱과 함께 깨지지 않게 하려는 것.
  image: busybox:1.37

# 돌고 있는 것을 밖에서 본다 (#677).
#
# **기본은 꺼짐** — `backup.alerts` 와 같은 이유다. Prometheus Operator 가 없는
# 클러스터에서는 `ServiceMonitor`·`PodMonitor` 라는 종류 자체가 없어서 설치가 깨진다.
#
# 켜면 api 는 `ServiceMonitor`(`/actuator/prometheus`), 채점기 둘과 실행기는
# `PodMonitor`(`/metrics`) 로 긁힌다. 워커에 Service 를 만들지 않는 이유는
# `templates/monitoring.yaml` 에 적어 두었다.
monitoring:
  enabled: false
  # 채점은 초 단위로 움직인다. 1분이면 대회 중 밀리는 구간이 한 점으로 뭉갠다.
  interval: 30s
  # 클러스터의 Prometheus 가 대상을 고르는 라벨. 그쪽 설정에 맞춘다.
  # 홈랩의 kube-prometheus-stack 은 `serviceMonitorSelectorNilUsesHelmValues: false`
  # 라 라벨 없이도 잡아간다 — 비워 두어도 된다.
  labels: {}
