# 지금 배포된 것 (#246).
#
# **이 파일이 배포 기록이다.** CI 가 main 의 이미지를 올린 뒤 여기에 그 커밋을 적고,
# ArgoCD 가 그 변화를 보고 클러스터를 맞춘다. `latest` 로는 이것이 성립하지 않는다 —
# 새 이미지가 올라가도 매니페스트가 그대로라 ArgoCD 는 Synced 라고만 말한다.
#
# 그래서 이 파일의 git 이력이 곧 배포 이력이다.
#   - 지금 무엇이 도는가  → 이 파일의 현재 내용
#   - 언제 무엇이 나갔나  → git log deploy/charts/codekr/values-release.yaml
#   - 되돌리기            → 이 파일을 이전 커밋의 값으로 되돌린다 (docs/09 §7)
#
# **사람이 손으로 고치지 않는다.** 되돌릴 때만 예외이고, 그때도 이력에 남는 편집이다.
#
# 네 앱이 같은 태그를 쓴다. api·judge·executor 는 큐 메시지 계약(libs/gocontract)을
# 공유하므로 섞이면 계약이 어긋난 조합이 돈다.
