# bun test 설정 (#642, #646).
[test]
# 화면을 그리는 시험이 있으므로 `document` 를 먼저 만들어 둔다 (#646).
preload = ["./test-setup.ts"]

# 커버리지는 `--coverage` 를 줄 때만 잰다 (#642). 여기서 켜 두면 매번 재느라 느려지고,
# 시험은 빠를수록 자주 돌린다.
coverageReporter = ["text", "lcov"]
# **시험 파일 자신은 세지 않는다.** 세면 시험을 쓸수록 숫자가 오르는데,
# 그것은 덮인 것이 늘어난 것이 아니다.
coverageSkipTestFiles = true
