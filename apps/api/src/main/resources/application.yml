spring:
  application:
    name: codekr-api
  threads:
    virtual:
      # 블로킹 JPA/HTTP 호출의 스레드 비용을 낮춘다 (ADR-0005).
      enabled: true
  datasource:
    url: ${CODEKR_DB_URL:jdbc:postgresql://localhost:15432/codekr}
    username: ${CODEKR_DB_USERNAME:codekr}
    password: ${CODEKR_DB_PASSWORD:codekr_local_pw}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 소유한다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${CODEKR_REDIS_HOST:localhost}
      port: ${CODEKR_REDIS_PORT:16379}
  servlet:
    multipart:
      # 아바타 업로드(#116)가 multipart 다. 꺼 두면 그 엔드포인트가 500 을 낸다.
      enabled: true
      # **우리 상한보다 크게 잡는다.** 컨테이너가 먼저 끊으면 "이미지는 5MB 이하여야
      # 합니다" 대신 원인을 알 수 없는 오류가 간다. 이 값은 마지막 방어선이다.
      #
      # 6MB 였을 때 **문제 묶음(#479)이 자기 상한(64MB)에 닿을 수가 없었다.**
      # 테스트케이스가 수백 개인 문제를 올리라고 만든 기능인데 컨테이너가 먼저 끊었다.
      # 맨 JSON 을 받게 되면서(#537) 더 조인다 — 압축되지 않은 만큼 그대로 크다.
      #
      # 아바타(#116)의 5MB 검사는 앱에 그대로 있으므로 이 값을 올려도 아바타는
      # 여전히 5MB 에서 거절된다. 다만 **거절되기 전까지는 버퍼링된다** — 이 값이 곧
      # 한 요청이 잡을 수 있는 최대 크기다.
      max-file-size: ${CODEKR_MAX_UPLOAD_SIZE:32MB}
      max-request-size: ${CODEKR_MAX_REQUEST_SIZE:34MB}

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-swallow-size: 2MB
  max-http-request-header-size: 16KB

codekr:
  # 데이터 초기화 (#285). **기본은 꺼짐** — 관리 화면에 "전부 지우기" 버튼을 다는 일이라
  # 켜는 것이 명시적인 선택이어야 한다.
  #
  # **배포는 이 값을 주지 않는다** (#303). 그리고 주려는 시도를 CI 가 막는다 —
  # "아무도 켜지 않았다" 에 기대면 언젠가 켜지고, 그 뒤로는 사고를 기다리는 장치가 된다.
  # 코드를 걷는 것은 제출이 쌓이기 시작하는 날의 정리 작업이다 (#303).
  data-reset:
    enabled: ${CODEKR_DATA_RESET_ENABLED:false}
  runtimes:
    # 앞에서부터 처음 존재하는 위치를 사용한다. 컨테이너에서는 /etc/codekr, 로컬 개발에서는 저장소 경로.
    locations: file:/etc/codekr/runtimes.yaml,file:../../infra/runtimes/runtimes.yaml
  cors:
    allowed-origins: ${CODEKR_CORS_ALLOWED_ORIGINS:http://localhost:13000}
  storage:
    # 오브젝트 스토리지 (#115). 비우면 업로드 API 가 503 을 낸다 —
    # 아바타 때문에 서비스 전체가 뜨지 못하면 안 된다.
    endpoint: ${CODEKR_STORAGE_ENDPOINT:}
    bucket: ${CODEKR_STORAGE_BUCKET:codekr}
    access-key: ${CODEKR_STORAGE_ACCESS_KEY:}
    secret-key: ${CODEKR_STORAGE_SECRET_KEY:}
  mail:
    # 메일 발송 (#233). **비우면 보내지 않는다** — 저장소(#115)와 같은 규칙이다.
    # 로컬에서 메일 서버 없이 전체가 돌아야 하고, 발송이 안 된다고 서비스가 뜨지
    # 못하면 안 된다.
    #
    # **보낼 수 없을 때는 인증을 요구하지도 않는다.** 요구만 하고 보내지 못하면
    # 아무도 인증할 수 없는 계정이 만들어진다.
    host: ${CODEKR_MAIL_HOST:}
    port: ${CODEKR_MAIL_PORT:587}
    # 붙자마자 TLS 인가 (#355). **465 는 STARTTLS 로 붙지 못한다** — 켜지 않으면
    # 타임아웃까지 매달렸다가 실패하고, 발송은 예외를 삼키므로 조용히 안 나간다.
    ssl: ${CODEKR_MAIL_SSL:false}
    username: ${CODEKR_MAIL_USERNAME:}
    password: ${CODEKR_MAIL_PASSWORD:}
    # **인증 계정과 같은 주소여야 한다** (#355). 다르면 제공자가 거부하거나
    # SPF/DKIM 정렬이 깨져 스팸함으로 간다.
    from: ${CODEKR_MAIL_FROM:no-reply@xn--hy1by51c.kr}
    # 인증 링크가 가리킬 곳. 메일은 서버가 만들므로 주소를 스스로 알아야 한다.
    site-url: ${CODEKR_SITE_URL:http://localhost:13000}
  # 문제 초안 만들기 (#230). **키가 없으면 기능이 없다** — 부르면 404 다.
  # 저장소(#115)·메일(#233)과 같은 규칙이라, 안 켜도 서비스는 그대로 돈다.
  problem-draft:
    base-url: ${CODEKR_DRAFT_BASE_URL:https://api.openai.com/v1}
    api-key: ${CODEKR_DRAFT_API_KEY:}
    model: ${CODEKR_DRAFT_MODEL:gpt-4o-mini}
  jwt:
    secret: ${CODEKR_JWT_SECRET:local-development-only-secret-change-me-please-32b}
    access-ttl-seconds: ${CODEKR_JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${CODEKR_JWT_REFRESH_TTL_SECONDS:1209600}
  # 어드민이 조정할 수 있는 워크로드 (#40, #390).
  #
  # **허용 목록이다.** 여기 적힌 것만 조정된다 — 경로에 이름을 받아 아무 배포나
  # 만질 수 있게 열면 어드민 화면이 곧 클러스터 전체를 만지는 도구가 된다.
  scaling:
    targets:
      executor:
        label: 실행기
        deployment: ${CODEKR_EXECUTOR_DEPLOYMENT:codekr-executor}
        namespace: ${CODEKR_EXECUTOR_NAMESPACE:}
        min-replicas: ${CODEKR_EXECUTOR_MIN_REPLICAS:1}
        max-replicas: ${CODEKR_EXECUTOR_MAX_REPLICAS:20}
      judge:
        label: 채점기
        deployment: ${CODEKR_JUDGE_DEPLOYMENT:codekr-judge}
        namespace: ${CODEKR_JUDGE_NAMESPACE:}
        min-replicas: ${CODEKR_JUDGE_MIN_REPLICAS:1}
        max-replicas: ${CODEKR_JUDGE_MAX_REPLICAS:10}
        # 차선이 있으면 워커 수도 조정된다 (#390).
        lane: general
      judge-contest:
        label: 대회 채점기
        deployment: ${CODEKR_JUDGE_CONTEST_DEPLOYMENT:codekr-judge-contest}
        namespace: ${CODEKR_JUDGE_CONTEST_NAMESPACE:}
        min-replicas: ${CODEKR_JUDGE_CONTEST_MIN_REPLICAS:1}
        max-replicas: ${CODEKR_JUDGE_CONTEST_MAX_REPLICAS:10}
        lane: contest
  retention:
    # 소프트 삭제된 행을 실제로 지우기까지의 유예 (#46)
    enabled: ${CODEKR_RETENTION_ENABLED:true}
    problem-days: ${CODEKR_RETENTION_PROBLEM_DAYS:90}
    problem-child-days: ${CODEKR_RETENTION_PROBLEM_CHILD_DAYS:30}
    batch-size: ${CODEKR_RETENTION_BATCH_SIZE:500}
  submission:
    max-source-code-bytes: 65536
    # 이 시간이 지나도 채점이 끝나지 않은 제출은 SYSTEM_ERROR 로 종결한다 (ADR-0004).
    stale-timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    kr.codekr: INFO
  # 로그를 Loki 에서 **고를 수 있게** 한다 (#679).
  #
  # 수집은 이미 된다 — 홈랩의 Promtail 이 모든 파드 로그를 가져간다. 못 쓰던 것은
  # api 것뿐이었다. judge·executor 는 `slog.NewJSONHandler` 로 이미 JSON 이라
  # `| json | level="ERROR"` 가 통하는데, api 만 Spring 기본 콘솔 패턴이라 통짜
  # 문자열이었다. 정규식으로 긁는 수밖에 없었고, 그러면 대시보드를 두 벌 써야 한다.
  #
  # **`logstash` 를 고른 이유는 `level` 하나다.** 세 형식 중 이것만 Go 의 slog 와
  # 같은 키에 같은 값(`"ERROR"`)을 쓴다. `ecs` 는 `log.level`, `gelf` 는 숫자다.
  #
  #   logstash  {"@timestamp":…, "level":"ERROR", "message":…, "logger_name":…}
  #   Go slog   {"@timestamp":…, "level":"ERROR", "message":…}
  #
  # Go 쪽은 기본값이 `time`·`msg` 라 `message`·`@timestamp` 로 맞췄다 (#679).
  # 세 앱에 **같은 쿼리 한 벌**이 통하는 것이 이 이슈의 요점이다.
  #
  # **프로파일로 가르지 않는다.** 로컬만 줄글로 두면 운영에서만 도는 경로가 하나
  # 생기고, 정작 디버깅할 때 보는 형식이 배포된 형식과 다르다. judge·executor 도
  # 로컬에서 JSON 이다 — 이 저장소의 선례를 그대로 따른다.
  structured:
    format:
      console: logstash
