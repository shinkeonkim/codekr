spring:
  application:
    name: codekr-api
  threads:
    virtual:
      # 블로킹 JPA/HTTP 호출의 스레드 비용을 낮춘다 (ADR-0005).
      enabled: true
  datasource:
    url: ${CODEKR_DB_URL:jdbc:postgresql://localhost:15432/codekr}
    username: ${CODEKR_DB_USERNAME:codekr}
    password: ${CODEKR_DB_PASSWORD:codekr_local_pw}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 소유한다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${CODEKR_REDIS_HOST:localhost}
      port: ${CODEKR_REDIS_PORT:16379}
  servlet:
    multipart:
      # 아바타 업로드(#116)가 multipart 다. 꺼 두면 그 엔드포인트가 500 을 낸다.
      enabled: true
      # **우리 상한(5MB)보다 크게 잡는다.** 컨테이너가 먼저 끊으면 "이미지는 5MB 이하여야
      # 합니다" 대신 원인을 알 수 없는 오류가 간다. 이 값은 마지막 방어선이다.
      max-file-size: 6MB
      max-request-size: 8MB

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-swallow-size: 2MB
  max-http-request-header-size: 16KB

codekr:
  # 데이터 초기화 (#285). **기본은 꺼짐** — 관리 화면에 "전부 지우기" 버튼을 다는 일이라
  # 켜는 것이 명시적인 선택이어야 한다. 운영을 시작하는 날 이 값을 내린다.
  data-reset:
    enabled: ${CODEKR_DATA_RESET_ENABLED:false}
  runtimes:
    # 앞에서부터 처음 존재하는 위치를 사용한다. 컨테이너에서는 /etc/codekr, 로컬 개발에서는 저장소 경로.
    locations: file:/etc/codekr/runtimes.yaml,file:../../infra/runtimes/runtimes.yaml
  cors:
    allowed-origins: ${CODEKR_CORS_ALLOWED_ORIGINS:http://localhost:13000}
  storage:
    # 오브젝트 스토리지 (#115). 비우면 업로드 API 가 503 을 낸다 —
    # 아바타 때문에 서비스 전체가 뜨지 못하면 안 된다.
    endpoint: ${CODEKR_STORAGE_ENDPOINT:}
    bucket: ${CODEKR_STORAGE_BUCKET:codekr}
    access-key: ${CODEKR_STORAGE_ACCESS_KEY:}
    secret-key: ${CODEKR_STORAGE_SECRET_KEY:}
  mail:
    # 메일 발송 (#233). **비우면 보내지 않는다** — 저장소(#115)와 같은 규칙이다.
    # 로컬에서 메일 서버 없이 전체가 돌아야 하고, 발송이 안 된다고 서비스가 뜨지
    # 못하면 안 된다.
    #
    # **보낼 수 없을 때는 인증을 요구하지도 않는다.** 요구만 하고 보내지 못하면
    # 아무도 인증할 수 없는 계정이 만들어진다.
    host: ${CODEKR_MAIL_HOST:}
    port: ${CODEKR_MAIL_PORT:587}
    # 붙자마자 TLS 인가 (#355). **465 는 STARTTLS 로 붙지 못한다** — 켜지 않으면
    # 타임아웃까지 매달렸다가 실패하고, 발송은 예외를 삼키므로 조용히 안 나간다.
    ssl: ${CODEKR_MAIL_SSL:false}
    username: ${CODEKR_MAIL_USERNAME:}
    password: ${CODEKR_MAIL_PASSWORD:}
    # **인증 계정과 같은 주소여야 한다** (#355). 다르면 제공자가 거부하거나
    # SPF/DKIM 정렬이 깨져 스팸함으로 간다.
    from: ${CODEKR_MAIL_FROM:no-reply@xn--hy1by51c.kr}
    # 인증 링크가 가리킬 곳. 메일은 서버가 만들므로 주소를 스스로 알아야 한다.
    site-url: ${CODEKR_SITE_URL:http://localhost:13000}
  jwt:
    secret: ${CODEKR_JWT_SECRET:local-development-only-secret-change-me-please-32b}
    access-ttl-seconds: ${CODEKR_JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${CODEKR_JWT_REFRESH_TTL_SECONDS:1209600}
  executor-scaling:
    # 어드민이 조정할 수 있는 실행기 배포와 범위 (#40)
    deployment: ${CODEKR_EXECUTOR_DEPLOYMENT:codekr-executor}
    namespace: ${CODEKR_EXECUTOR_NAMESPACE:}
    min-replicas: ${CODEKR_EXECUTOR_MIN_REPLICAS:1}
    max-replicas: ${CODEKR_EXECUTOR_MAX_REPLICAS:20}
  retention:
    # 소프트 삭제된 행을 실제로 지우기까지의 유예 (#46)
    enabled: ${CODEKR_RETENTION_ENABLED:true}
    problem-days: ${CODEKR_RETENTION_PROBLEM_DAYS:90}
    problem-child-days: ${CODEKR_RETENTION_PROBLEM_CHILD_DAYS:30}
    batch-size: ${CODEKR_RETENTION_BATCH_SIZE:500}
  submission:
    max-source-code-bytes: 65536
    # 이 시간이 지나도 채점이 끝나지 않은 제출은 SYSTEM_ERROR 로 종결한다 (ADR-0004).
    stale-timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    kr.codekr: INFO
