name: 런타임 이미지

# 공식 이미지가 없어 직접 만드는 런타임(kotlin, csharp)만 빌드한다.
# 나머지 언어는 공식 이미지를 그대로 쓰므로 빌드할 것이 없다.
on:
  push:
    branches: [main]
    paths:
      - "infra/runtimes/images/**"
      - ".github/workflows/runtime-images.yml"
  pull_request:
    paths:
      - "infra/runtimes/images/**"
  # 베이스 이미지의 보안 패치를 반영하려면 주기적으로 다시 만들어야 한다.
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.language }} 런타임 이미지
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - language: kotlin
            tag: "2.2"
          - language: csharp
            tag: "9"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/runtimes/images/${{ matrix.language }}
          # PR 에서는 빌드가 되는지만 확인하고 푸시하지 않는다.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/codekr-runtime-${{ matrix.language }}:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
