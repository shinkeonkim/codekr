name: 배포

# 특정 버전을 다시 배포한다 (#348).
#
# **CI 와 나눈 이유.** CI 는 "이 커밋이 쓸 만한가" 를 판정하는 곳이고 배포는 다른
# 질문이다. 그리고 이 워크플로는 `contents: write` 가 필요한데, 그것을 CI 의 수동
# 실행에 열면 **워크플로를 돌릴 수 있는 사람이 main 에 커밋할 수 있게** 된다.
# 워크플로를 나누면 그 권한도 나뉜다.
#
# 배포 경로는 이제 둘이지만 **의도가 분명한 둘**이다 — 자동(머지, #246)과 수동(여기).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 커밋 sha (비우면 직전 배포로 되돌린다)"
        type: string
        default: ""
      reason:
        description: "왜 이 배포가 필요한가 (커밋 메시지에 남는다)"
        type: string
        required: true

# **배포가 겹치면 안 된다.** CI 와 다른 그룹이고, 진행 중인 것을 죽이지 않는다 —
# 태그를 적고 미는 중간에 끊기면 무엇이 나갔는지 알 수 없다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 배포 태그 갱신
    runs-on: ubuntu-latest
    permissions:
      # 같은 저장소에 커밋한다 — ArgoCD 가 이 저장소의 차트를 직접 읽는다 (#246).
      contents: write
      # ghcr 에 이미지가 있는지 보기 위해서다. 밀지는 않는다.
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 이력을 거슬러 올라가야 한다 — 얕게 받으면 "직전 배포" 를 못 찾는다.
          fetch-depth: 0

      - name: 어느 커밋을 적을지 정한다
        id: target
        env:
          REQUESTED: ${{ inputs.ref }}
        run: .github/scripts/resolve-deploy-tag.sh

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **적기 전에 이미지가 있는지 본다** (#348).
      #
      # 자동 배포에는 `needs: images` 라는 보호가 있다 — 이미지가 올라간 뒤에만 태그를
      # 적는다. 수동 배포에는 그 보호가 없어서 아무 sha 나 적을 수 있고, 그러면
      # 매니페스트가 없는 이미지를 가리켜 **클러스터가 ImagePullBackOff 로 멈춘다.**
      #
      # 넷을 다 본다. 하나라도 없으면 그 조합은 계약이 어긋난다 (api·judge·executor 가
      # libs/gocontract 를 공유한다).
      - name: 이미지 넷이 다 있는지 확인한다
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          missing=""
          for app in api web judge executor; do
            image="ghcr.io/${{ github.repository_owner }}/codekr-${app}:${TAG}"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "  있음: codekr-${app}"
            else
              echo "  없음: codekr-${app}"
              missing="${missing}${app} "
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::이미지가 없습니다: ${missing}— 이 sha 로 배포하면 ImagePullBackOff 로 멈춥니다."
            echo "::error::CI 가 그 커밋의 이미지를 만들었는지 확인하세요 (main 에 머지된 커밋이어야 합니다)."
            exit 1
          fi

      - name: 배포 태그를 적고 민다
        env:
          TAG: ${{ steps.target.outputs.tag }}
          PREVIOUS: ${{ steps.target.outputs.previous }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          file=deploy/charts/codekr/values-release.yaml
          # 주석(= 이 파일이 왜 있는지)은 남기고 값만 바꾼다.
          sed -i "s|^  imageTag: .*|  imageTag: ${TAG}|" "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          # **자동 배포와 구분된다** — 이 파일의 git 이력이 곧 배포 이력이므로(#246),
          # 그 이력을 읽는 사람이 무엇이 손으로 나갔는지 알아야 한다.
          git commit -m "chore(deploy): ${TAG:0:7} 수동 배포 (#348)" \
            -m "이전: ${PREVIOUS:0:7}" \
            -m "사유: ${REASON}" \
            -m "실행: @${GITHUB_ACTOR}"
          # 사람이 그사이 main 에 밀어 넣었을 수 있다. 덮어쓰지 않고 다시 시도한다.
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          echo "::error::main 에 밀지 못했습니다. 배포 태그는 갱신되지 않았습니다."
          exit 1

      - name: 무엇이 나갔는지 남긴다
        if: always()
        env:
          TAG: ${{ steps.target.outputs.tag }}
          PREVIOUS: ${{ steps.target.outputs.previous }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## 수동 배포"
            echo
            if [ -z "${TAG}" ]; then
              echo "**배포하지 않았습니다.** 위 로그의 오류를 보세요."
            else
              echo "| | |"
              echo "|---|---|"
              echo "| 배포한 것 | \`${TAG}\` |"
              echo "| 이전 | \`${PREVIOUS}\` |"
              echo "| 사유 | ${REASON} |"
              echo "| 실행 | @${GITHUB_ACTOR} |"
              echo
              echo "> 태그를 적었을 뿐입니다. **실제로 바뀌는 것은 ArgoCD 가 sync 한 뒤**입니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
