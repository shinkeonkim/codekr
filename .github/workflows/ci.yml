name: CI

on:
  pull_request:
  # 손으로 돌린다 (#317).
  #
  # **배포는 여기서 나가지 않는다** — `images`·`release` 는 push 에서만 돈다.
  # 배포하는 길은 "main 에 머지하면 나간다"(#246) 하나뿐이어야, 무엇이 어떻게
  # 나갔는지 추적할 수 있다.
  workflow_dispatch:
    inputs:
      # **체크박스 여럿이다** (#343). `type: choice` 는 하나만 고를 수 있어서
      # "api 와 web 만" 이 안 됐다. 쉼표 문자열도 방법이지만 자유 입력이라
      # 오타(`wbe`)가 조용히 통과한다 — **아무것도 안 돌았는데 초록**이 이 저장소가
      # 이미 두 번 겪은 사고다 (#248, #172).
      changed_only:
        description: "기본 브랜치와 달라진 영역 (아래 체크와 합집합)"
        type: boolean
        default: true
      api:
        description: "api"
        type: boolean
        default: false
      web:
        description: "web"
        type: boolean
        default: false
      go:
        description: "go (executor·judge)"
        type: boolean
        default: false
      sandbox:
        description: "샌드박스 라이브 (느리다)"
        type: boolean
        default: false
      # **밀지 않고 빌드만 한다** (#343). 여기서 이미지를 만드는 이유는 브랜치에서
      # Dockerfile 이 빌드되는지 보는 것뿐이다 — 배포는 #348 이 따로 한다.
      # 밀지 않으므로 `:latest` 오염도, ghcr 에 쌓이는 브랜치 이미지도 없다.
      build_images:
        description: "컨테이너 이미지 빌드 (밀지는 않는다)"
        type: boolean
        default: false
  push:
    branches: [main]
    # 배포 태그 커밋(아래 release 잡)이 CI 를 다시 돌리지 않게 한다 (#246).
    # 그 커밋에는 이 파일 하나만 들어 있으므로, 이 제외 하나로 고리가 끊긴다.
    paths-ignore:
      - "deploy/charts/codekr/values-release.yaml"

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행은 취소한다.
#
# **수동 실행은 자기들끼리만 취소한다** (#317). 그룹에 이벤트 이름이 들어가므로,
# 무거운 검사를 손으로 돌려 보는 동안 남의 PR CI 가 죽지 않는다. 같은 브랜치에서
# 수동 실행을 두 번 하면 앞의 것은 죽는데, 그것은 의도한 동작이다 — 옵션을 바꿔
# 다시 돌리는 흐름이 흔하다.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-files:
    name: 들어오면 안 되는 파일
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **`.gitignore` 만으로는 부족하다** (#467). 심볼릭 링크는 디렉터리가 아니라서
      # `node_modules/`(슬래시)에 걸리지 않았고, 그렇게 들어온 링크가 브랜치 열둘에
      # 딸려 다녔다. 규칙을 고쳐도 **다시 들어오는 것을 막는 것은 검사뿐**이다.
      # **데이터 초기화는 배포에 실리지 않는다** (#285, #303). 지금은 차트가 그 값을
      # 주지 않아 꺼져 있는데, 그것이 "아무도 켜지 않았다" 에 기대고 있다 — 한 번
      # 켜지면 그 뒤로는 사고를 기다리는 장치가 된다.
      - name: 데이터 초기화가 배포에 켜져 있지 않은지
        run: |
          enabled=$(grep -rn "CODEKR_DATA_RESET_ENABLED" deploy/ || true)
          if [ -n "$enabled" ]; then
            echo "::error::배포 차트에서 데이터 초기화를 켜려 하고 있습니다 (#303):"
            echo "$enabled"
            exit 1
          fi

      - name: node_modules 가 커밋되지 않았는지
        run: |
          tracked=$(git ls-files | grep -E '(^|/)node_modules($|/)' || true)
          if [ -n "$tracked" ]; then
            echo "::error::node_modules 가 커밋되어 있습니다:"
            echo "$tracked"
            exit 1
          fi

      # **지문에 값을 적는 것의 위험은 하나다** (#526): 시드가 바뀌면 지문이 거짓이 된다.
      # 값이 없는 것보다 나쁘다 — 없으면 실행해 보면 되지만, 틀린 값은 사람을 잘못된
      # 곳으로 데려간다. 사람이 눈으로 맞춰 보는 것에 기대지 않는다.
      - name: SQL 문제 지문의 예시 데이터가 시드와 맞는지
        run: python3 scripts/check-sql-samples.py

      # **배지가 기능이 들어온 날부터 계속 404 였다** (#475). 엔드포인트는 일부러
      # `/api` 밖에 두었는데 인그레스는 `/api`·`/ws` 만 API 로 보낸다 — 코드도 차트도
      # 각자 맞았고 **둘 사이가 비어 있었다.** 로컬에서는 API 를 직접 불러 드러나지 않는다.
      - name: API 가 여는 경로가 인그레스에 있는지
        run: python3 scripts/check-ingress-paths.py

  changes:
    name: 변경 영역 판별
    runs-on: ubuntu-latest
    # paths-filter 는 PR 의 변경 파일 목록을 API 로 가져온다. 이 권한이 없으면
    # "Resource not accessible by integration" 으로 실패하고, 뒤따르는 테스트 잡이
    # 전부 skip 된다 — CI 가 통과한 것처럼 보이지만 아무것도 검증하지 않는 상태가 된다.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.decide.outputs.api }}
      web: ${{ steps.decide.outputs.web }}
      go: ${{ steps.decide.outputs.go }}
      sandbox: ${{ steps.decide.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        # "변경된 것만" 을 끈 수동 실행에는 비교할 것이 없다 (#317, #343).
        if: github.event_name != 'workflow_dispatch' || inputs.changed_only
        with:
          # 수동 실행에는 비교 대상이 없다 — 이 브랜치와 기본 브랜치의 차이를 본다.
          base: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || '' }}
          filters: |
            api:
              - 'apps/api/**'
              - 'infra/runtimes/**'
            web:
              - 'apps/web/**'
            go:
              - 'apps/executor/**'
              - 'apps/judge/**'
              - 'libs/gocontract/**'
            sandbox:
              - 'apps/executor/**'
              - 'infra/sandbox/**'
              - 'infra/runtimes/**'

      # 손으로 고른 값이 있으면 그것이 이긴다 (#317).
      #
      # **판정을 한 곳에 모은다.** 잡마다 `inputs.scope` 를 다시 해석하게 하면
      # 조건이 여섯 군데로 흩어지고, 그중 하나만 어긋나도 "안 돌았는데 초록" 이 된다.
      #
      # **판정은 `.github/scripts/decide-scope.sh` 에 있다** (#343). 여기 인라인으로
      # 두면 고치는 사람이 확인할 방법이 푸시뿐이다 — 이 워크플로가 겪은 사고가
      # 전부 그 자리에서 났다.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.changed_only }}
          PICK_API: ${{ github.event_name == 'workflow_dispatch' && inputs.api }}
          PICK_WEB: ${{ github.event_name == 'workflow_dispatch' && inputs.web }}
          PICK_GO: ${{ github.event_name == 'workflow_dispatch' && inputs.go }}
          PICK_SANDBOX: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox }}
          # 건너뛴 단계의 출력은 빈 문자열이다 — 스크립트가 false 로 읽는다.
          CHANGED_API: ${{ steps.filter.outputs.api }}
          CHANGED_WEB: ${{ steps.filter.outputs.web }}
          CHANGED_GO: ${{ steps.filter.outputs.go }}
          CHANGED_SANDBOX: ${{ steps.filter.outputs.sandbox }}
        run: .github/scripts/decide-scope.sh

  migration-versions:
    name: Flyway 버전 겹침
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      # **main 을 같이 봐야 해서 얕은 체크아웃으로는 안 된다** (#519). 겹침은 브랜치
      # 안에서는 안 보이고 합쳐진 뒤에야 생기므로, 비교 대상인 main 이 있어야 한다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main --depth=1
      # 판정은 스크립트에 있다 — 손으로도 돌려 볼 수 있게 (decide-scope.sh 와 같은 결).
      - run: .github/scripts/check-migration-versions.sh
        env:
          BASE_REF: origin/main

  api-test:
    name: api 단위 테스트
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # **같은 번호가 둘이면 Flyway 가 아예 뜨지 않는다.** 두 브랜치가 각자 다음 번호를
      # 집으면 각각은 통과하고 **합쳐진 뒤에 깨진다** — 그것이 실제로 일어났다.
      # 시험보다 먼저 본다: 이것이 깨지면 어차피 모든 통합 시험이 컨텍스트 로딩에서 죽는다.
      - name: 마이그레이션 번호 중복 확인
        run: |
          dupes=$(ls src/main/resources/db/migration | grep -oE '^V[0-9]+' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::같은 번호의 마이그레이션이 둘 이상입니다: $dupes"
            exit 1
          fi
      # Testcontainers 가 필요한 통합 테스트는 아래 별도 잡에서 돌린다.
      - run: ./gradlew test

  api-integration-test:
    name: api 통합 테스트 (Testcontainers)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew integrationTest

  go-check:
    name: executor · judge 린트 · 테스트
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [executor, judge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          # go.mod 의 Go 버전보다 낮은 Go 로 빌드된 golangci-lint 는 패키지를 읽다가
          # 패닉한다("file requires newer Go version"). Go 를 올리면 여기도 같이 올려야 한다.
          version: v2.12
          working-directory: apps/${{ matrix.module }}
          args: --config ${{ github.workspace }}/.golangci.yml
      # 컨테이너 런타임이 필요한 라이브 샌드박스 테스트는 CODEKR_SANDBOX_TEST 로 분리돼 있다.
      - run: go test ./...
        working-directory: apps/${{ matrix.module }}

  sandbox-live:
    # 러너에는 containerd 가 이미 있다. macOS 에서 겪은 FIFO 제약(#70)이 없다 —
    # 클라이언트와 containerd 가 같은 커널을 쓰기 때문이다.
    name: 샌드박스 라이브 검증 (containerd)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/executor/go.sum

      - name: containerd 소켓 확인
        run: |
          # 소켓이 없으면 뒤 단계가 전부 SKIP 으로 조용히 넘어간다. 여기서 끊는다.
          test -S /run/containerd/containerd.sock
          sudo ctr version || echo "ctr 없음 — 소켓만 확인하고 넘어간다"

      # 소켓이 root 소유라 시험을 sudo 로 돌려야 한다. `go test` 를 sudo 로 돌리면
      # 캐시·모듈 경로가 root 것으로 바뀌므로, 바이너리로 뽑아서 그것만 올린다.
      - name: 시험 바이너리 빌드
        working-directory: apps/executor
        run: |
          go test -c -o /tmp/selftest.test ./internal/selftest/
          go test -c -o /tmp/sandbox.test  ./internal/sandbox/

      - name: "--self-test 9개"
        working-directory: apps/executor
        env:
          CODEKR_SANDBOX_TEST: "1"
          CODEKR_SANDBOX_RUNTIME: containerd
          CONTAINERD_ADDRESS: /run/containerd/containerd.sock
          CODEKR_SECCOMP_PROFILE: ${{ github.workspace }}/infra/sandbox/seccomp.json
          # 검사 이미지는 정의 파일에서 온다 (#218). 여기서 가리키지 않으면 시험이
          # 저장소 루트를 스스로 찾아야 하는데, 바이너리를 apps/executor 에서 돌리므로
          # 기준 폴더가 `go test` 와 다르다.
          CODEKR_RUNTIMES_PATH: ${{ github.workspace }}/infra/runtimes/runtimes.yaml
        run: |
          # **pipefail 이 없으면 tee 가 시험 실패를 삼킨다.** 실제로 그랬다 — 라이브
          # 시험 하나가 실패했는데 잡은 초록이었다.
          set -o pipefail
          sudo -E /tmp/selftest.test -test.run TestLive -test.v 2>&1 | tee /tmp/selftest.log
          # **통과보다 실제로 돌았는지가 중요하다.** 환경 변수를 빠뜨리면 전부 SKIP 인데
          # 초록으로 보인다 — 그것이 가장 나쁜 결과다.
          passed=$(grep -c '^    --- PASS' /tmp/selftest.log || true)
          echo "통과한 검사: ${passed}개"
          # 숫자를 박아 두는 이유: 검사를 늘렸는데 이 줄을 잊으면 새 검사가 돌았는지
          # 아무도 확인하지 않는다. 셸 검사 둘을 더해 9개다 (#456).
          test "$passed" -eq 9

      - name: 채점 흐름 · seccomp · SQL · MariaDB · Redis · 여러 파일 · 인터랙티브 · 재매핑
        working-directory: apps/executor/internal/sandbox
        env:
          CODEKR_SANDBOX_TEST: "1"
          CODEKR_SANDBOX_RUNTIME: containerd
          CONTAINERD_ADDRESS: /run/containerd/containerd.sock
          CODEKR_SECCOMP_PROFILE: ${{ github.workspace }}/infra/sandbox/seccomp.json
          # 재매핑까지 걸어 둔다 (#130). 걸리지 않으면 TestLiveUserNamespaceRemapping 이
          # /proc/self/uid_map 을 읽어 잡는다.
          CODEKR_USERNS_HOST_OFFSET: "100000"
        run: |
          # 런타임 매트릭스는 뺀다. 15개 중 2개가 아직 없는 이미지를 가리켜 실패한다 (#171).
          # 이미지가 올라가면 이 제외를 지운다.
          set -o pipefail
          sudo -E /tmp/sandbox.test -test.v -test.timeout 30m \
            -test.run 'TestLive(Runs|Reports|Detects|Blocks|Hardening|Narrowed|SQL|MariaDB|Redis|MultiFile|Interactive|UserNamespace)' \
            2>&1 | tee /tmp/sandbox.log
          ran=$(grep -cE '^(    )?--- (PASS|FAIL)' /tmp/sandbox.log || true)
          failed=$(grep -cE '^(    )?--- FAIL' /tmp/sandbox.log || true)
          echo "돌아간 검사: ${ran}개 (실패 ${failed}개)"
          # SKIP 만 남은 상태를 막는 하한이다. 검사를 늘리면 이 숫자도 올린다.
          # MariaDB 10개(#454)·Redis 11개(#455)·여러 파일 9개(#457)·인터랙티브 4개(#474)를
          # 더해 54개다. 로컬 실측과 같은 필터다.
          test "$ran" -ge 52
          # 세는 것만으로는 부족하다. **실패가 0 인지도 따로 본다** — pipefail 을 빠뜨렸을
          # 때 이 줄이 마지막 방어선이 된다.
          test "$failed" -eq 0

  web-check:
    name: web 린트 · 타입 체크 · 빌드
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  images:
    name: 컨테이너 이미지 빌드·푸시
    needs: [api-test, go-check, web-check]
    # main 에 머지된 변경만 이미지로 **민다**. 앞선 잡이 건너뛰어도 진행한다.
    #
    # **수동 실행은 빌드만 한다** (#343). 배포하는 길은 "main 에 머지하면 나간다"
    # (#246) 하나뿐이어야 한다 — 길이 둘이면 무엇이 어떻게 나갔는지 추적이 어려워지고,
    # 손으로 CI 를 돌린 것이 배포가 되는 실수의 자리가 생긴다. 그래서 여기서 여는 것은
    # **"이 브랜치에서 Dockerfile 이 빌드되는가"** 하나뿐이고, 밀지 않는다.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main'
       || github.event_name == 'workflow_dispatch' && inputs.build_images)
      && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, judge, executor]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 밀 때만 로그인한다. 빌드만 하는 실행에 자격증명을 쥐여 줄 이유가 없다.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # 빌드 컨텍스트는 저장소 루트다 — Go 앱이 libs/gocontract 를 공유한다.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # 수동 실행은 밀지 않는다 (#343).
          push: ${{ github.event_name == 'push' }}
          # **수동 실행에서는 `:latest` 를 이름조차 짓지 않는다.** `push: false` 만으로도
          # 안 밀리지만, 다음 사람이 push 조건을 건드릴 때 태그가 그대로 남아 있으면
          # 그때 `:latest` 가 브랜치 이미지로 덮인다.
          tags: ${{ github.event_name == 'push' && format('ghcr.io/{0}/codekr-{1}:latest,ghcr.io/{0}/codekr-{1}:{2}', github.repository_owner, matrix.app, github.sha) || format('ghcr.io/{0}/codekr-{1}:{2}', github.repository_owner, matrix.app, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 배포 태그 갱신
    needs: images
    # 이미지가 실제로 올라간 뒤에만 태그를 적는다. 순서가 뒤집히면 매니페스트가
    # 아직 없는 이미지를 가리키고, 클러스터는 ImagePullBackOff 로 멈춘다.
    #
    # **`!cancelled()` 가 없으면 이 잡은 조용히 건너뛰어진다** (#248). `images` 는
    # 성공했는데도 그랬다 — 앞선 잡(api-test·web-check)이 변경 없음으로 건너뛰어지면,
    # 그 뒤를 잇는 잡도 스스로 "건너뛴 조상이 있어도 돈다" 고 밝히지 않는 한 함께
    # 건너뛰어진다. `images` 는 그렇게 밝혀 두었지만 여기는 빠뜨렸다.
    #
    # 그래서 CI 는 초록인데 배포 태그는 그대로였다 — **돌지 않았는데 초록인 것**이
    # 가장 나쁜 결과다(#172). `needs.images.result` 를 직접 보게 해 그 침묵을 없앤다.
    # 이미지와 같은 이유로 push 에서만 돈다 (#317). 게다가 이 잡은 `contents: write`
    # 라, 수동 실행에 열면 **워크플로를 돌릴 수 있는 사람이 main 에 커밋할 수 있게** 된다.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !cancelled() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # 같은 저장소에 커밋한다 — ArgoCD 가 이 저장소의 차트를 직접 읽기 때문이다 (#246).
      # 다른 저장소였다면 홈랩 전체에 쓰기 권한을 가진 토큰이 필요했다.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 배포 태그를 이 커밋으로 적는다
        run: |
          set -euo pipefail
          file=deploy/charts/codekr/values-release.yaml
          # 주석(= 이 파일이 왜 있는지)은 남기고 값만 바꾼다.
          sed -i "s|^  imageTag: .*|  imageTag: ${GITHUB_SHA}|" "$file"
          git diff --quiet "$file" && { echo "태그가 이미 ${GITHUB_SHA} 입니다"; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore(deploy): ${GITHUB_SHA:0:7} 배포 (#246)"
          # 사람이 그사이 main 에 밀어 넣었을 수 있다. 덮어쓰지 않고 다시 시도한다.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1

  summary:
    name: 이번 실행에서 무엇이 돌았나
    # **끝에 항상 남긴다** (#317). 옵션을 잘못 줘서 아무것도 안 돌았는데 초록인 상태가
    # 가장 나쁜 결과다 (#248 이 겪은 것). 그것이 요약에 그대로 보이게 한다.
    needs: [changes, migration-versions, api-test, api-integration-test, go-check, sandbox-live, web-check, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 요약 쓰기
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && format('변경된 것만={0} api={1} web={2} go={3} sandbox={4}', inputs.changed_only, inputs.api, inputs.web, inputs.go, inputs.sandbox) || '(자동)' }}
          IMAGES: ${{ needs.images.result }}
          MIGRATIONS: ${{ needs.migration-versions.result }}
          API: ${{ needs.api-test.result }}
          API_IT: ${{ needs.api-integration-test.result }}
          GO: ${{ needs.go-check.result }}
          SANDBOX: ${{ needs.sandbox-live.result }}
          WEB: ${{ needs.web-check.result }}
        run: |
          {
            echo "## 이번 실행"
            echo
            echo "- 계기: \`${{ github.event_name }}\`  ·  고른 범위: **${SCOPE}**"
            echo
            echo "| 잡 | 결과 |"
            echo "|---|---|"
            echo "| Flyway 버전 겹침 | ${MIGRATIONS} |"
            echo "| api 단위 | ${API} |"
            echo "| api 통합 | ${API_IT} |"
            echo "| go | ${GO} |"
            echo "| 샌드박스 라이브 | ${SANDBOX} |"
            echo "| web | ${WEB} |"
            echo "| 이미지 빌드 | ${IMAGES} |"
            echo
            if [ "${API}" = "skipped" ] && [ "${API_IT}" = "skipped" ] \
               && [ "${GO}" = "skipped" ] && [ "${SANDBOX}" = "skipped" ] \
               && [ "${WEB}" = "skipped" ]; then
              echo "> **아무 잡도 돌지 않았습니다.** 범위를 확인하세요."
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "> 수동 실행은 **밀지 않습니다** — 이미지 빌드를 켰어도 ghcr 에 올라가지 않고,"
              echo "> 배포 태그도 갱신되지 않습니다 (#343). 배포는 배포 워크플로가 합니다 (#348)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
