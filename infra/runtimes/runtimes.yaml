  # ── JavaScript ────────────────────────────────────────────────────────────
  - id: "javascript:22"
    label: "JavaScript (Node 22)"
    monacoLanguage: "javascript"
    image: "node:22-alpine"
    digest: "sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32"
    sourceFile: "main.js"
    run: ["node", "main.js"]
    template: |
      const data = require('fs').readFileSync(0, 'utf8').trim().split(/\s+/);
      console.log(data.map(Number).reduce((a, b) => a + b, 0));
    # 함수형 문제 (#421, #616).
    #
    # 하네스를 **파일에서 읽어 지운 뒤 `node -e` 로 넘긴다.** 남겨 두면 사용자 코드가
    # `readFileSync("main.js")` 로 그대로 읽는다 — 파이썬 로더와 같은 이유다.
    # `node -e` 안에서도 `require` 는 그대로 쓸 수 있어 하네스가 손해 보는 것이 없다.
    #
    # **사용자에게 `module.exports` 를 요구하지 않는다.** 하네스가 `vm` 으로
    # `solution.js` 를 돌려 거기 정의된 함수를 꺼낸다 — 기초 문제에서 배울 것은
    # 모듈 체계가 아니다. 대신 하네스마다 그 몇 줄이 붙는다.
    functionHarness:
      file: "main.js"
      sourceFile: "solution.js"
      run: ["sh", "-c", "SRC=$(cat main.js) && rm -f main.js && exec node -e \"$SRC\""]

