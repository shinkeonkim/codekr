  # ── C / C++ ───────────────────────────────────────────────────────────────
  - id: "cpp:17"
    label: "C++17 (GCC 13)"
    monacoLanguage: "cpp"
    image: "gcc:13"
    digest: "sha256:ad3bd9a25f8495c0d2830d9fdd15c6ce889ada806bc1a00f611f22411a1f8b7c"
    sourceFile: "main.cpp"
    # `*.cpp` 인 이유 (#457): 여러 파일로 내는 문제에서 형제 파일도 컴파일해야 한다.
    # 파일이 하나면 지금까지와 같다.
    compile: ["sh", "-c", "g++ -O2 -std=c++17 -o main *.cpp"]
    run: ["./main"]
    template: |
      #include <bits/stdc++.h>
      using namespace std;

      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long a, b;
          cin >> a >> b;
          cout << a + b << '\n';
          return 0;
      }

