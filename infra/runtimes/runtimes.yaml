# 코드 실행 런타임 레지스트리 — api 와 executor 가 공유하는 단일 정의.
#
# 언어나 버전을 추가할 때는 이미지 하나와 아래 항목 하나만 늘리면 된다 (ADR-0003).
#   id            : 제출/실행 요청에서 쓰는 식별자 (언어:버전)
#   label         : 화면에 보여줄 이름
#   monacoLanguage: 에디터 문법 강조용 언어 키
#   image         : 샌드박스 컨테이너 이미지 (공식 이미지를 그대로 쓴다)
#   sourceFile    : 작업 디렉터리에 기록할 소스 파일명
#   compile       : (선택) 컴파일 명령. 없으면 인터프리터 언어로 취급한다
#   run           : 실행 명령
#   template      : 에디터 초기 코드 (문제가 지정한 초기 코드가 있으면 그쪽이 우선한다)
#
# 이미지 선택 기준
#   - 공식 이미지를 쓰고 자체 빌드하지 않는다. 유지보수 대상을 늘리지 않기 위함이다.
#     공식 이미지가 없는 언어(Kotlin, C#)만 infra/runtimes/images/ 에서 직접 만든다.
#   - 컴파일러가 필요한 언어는 SDK 이미지를, 인터프리터 언어는 alpine 변형을 쓴다.
#   - 실행 계정(UID 10001)은 이미지에 없어도 되므로 별도 준비가 필요 없다
#
# 미러링과 다이제스트 고정 (#96)
#   digest 를 적어 두면 실행 노드가 **그 다이제스트로만** 이미지를 받는다.
#   태그는 다시 붙을 수 있어서, 적지 않으면 우리가 검증한 것과 다른 것이 노드에 들어갈 수 있다.
#   digest 는 비워 둘 수 있다 — 로컬 개발은 태그로 받는다.
#
# 이미지 주소는 **짧은 이름**으로 적는다 (#171)
#   레지스트리는 실행기 설정(CODEKR_RUNTIME_REGISTRY)이 앞에 붙인다. 그래서 자체 빌드
#   런타임도 공개 이미지와 같은 규칙을 쓴다 — 주소에 특정 레지스트리를 박아 두면
#   그곳에 올리지 못하는 환경에서 정의 파일을 통째로 고쳐야 한다.
#
#   자체 빌드 런타임은 홈랩 레지스트리에서 만들어 둔다 (oh-my-homelab).
#   로컬 개발에서는 `make build-runtimes` 가 같은 이름으로 만든다.

runtimes:
  # ── Python ────────────────────────────────────────────────────────────────
  - id: "python:3.13"
    label: "Python 3.13"
    monacoLanguage: "python"
    image: "python:3.13-alpine"
    digest: "sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d"
    sourceFile: "main.py"
    run: ["python3", "main.py"]
    template: |
      import sys

      def main():
          data = sys.stdin.read().split()
          print(sum(map(int, data)))

      main()
    # 함수형 문제 (#421, #445). 하네스와 사용자 코드를 **파일로 나눠** 놓고 하네스를 돈다.
    #
    # 로더가 하네스를 읽자마자 **지운다.** 그러지 않으면 사용자 코드가 같은 디렉터리에서
    # `open("main.py")` 로 그대로 읽을 수 있다 — 하네스에는 정답의 일부나 테스트 방식이
    # 들어간다. 지운 뒤에도 `compile(src, "main.py", ...)` 이라 **트레이스백의 줄 번호는
    # 그대로**이고, 파일이 없으므로 파이썬이 하네스의 소스를 함께 찍지도 못한다.
    functionHarness:
      file: "main.py"
      # 사용자 코드는 import 되는 쪽으로 간다 — 진입점은 하네스가 가져간다.
      sourceFile: "solution.py"
      run:
        - "python"
        - "-c"
        - 'import os,sys;p="main.py";src=open(p).read();os.remove(p);sys.argv=[p];exec(compile(src,p,"exec"),{"__name__":"__main__","__file__":p})'
  - id: "python:3.12"
    label: "Python 3.12"
    monacoLanguage: "python"
    image: "python:3.12-alpine"
    digest: "sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df"
