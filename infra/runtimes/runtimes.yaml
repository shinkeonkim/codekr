      }

  # ── SQL ───────────────────────────────────────────────────────────────────
  # 문제마다 새 PostgreSQL 을 컨테이너 안에서 띄운다 (#60).
  #
  # 서버를 미리 띄워 두지 않는 이유: 제출끼리 같은 인스턴스를 나눠 쓰면 한 사람의
  # 쿼리가 다른 사람의 결과에 영향을 준다. 컨테이너와 함께 사라지는 편이 안전하다.
  #
  # user 가 70:70 인 이유: initdb 는 UID 가 /etc/passwd 에 없으면 거부한다.
  # 기본 계정(10001)은 postgres 이미지에 없다.
  - id: "sql:postgres16"
    label: "PostgreSQL 16"
    monacoLanguage: "sql"
    # 이 런타임은 SQL 문제에서만 고를 수 있다 (#60).
    problemKind: "JUDGE_SQL"
    image: "postgres:16-alpine"
    digest: "sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777"
    sourceFile: "query.sql"
    # PostgreSQL 을 띄우고 읽기 전용 롤을 만드는 스크립트. 실행기가 갖고 있다.
    harness: "sql"
    user: "70:70"
    run: ["sh", "run-sql.sh"]
    template: |
      -- 여기에 SELECT 문을 작성하세요.
      SELECT 1 + 2;

