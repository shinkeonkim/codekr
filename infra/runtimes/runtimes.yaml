  # ── Shell ─────────────────────────────────────────────────────────────────
  # 셸 문제 (#456). **stdin/stdout 만 한다.**
  #
  # 셸 문제의 절반은 "이 디렉터리의 .log 중 가장 큰 것" 처럼 **파일 시스템이 입력**이지만,
  # 그것은 채점 모델이 바뀌는 일이다(끝난 뒤의 상태를 봐야 한다). #453 이 SQL 에서 그 길을
  # 냈고, 파일 시스템 판은 그 위에 얹는다. 지금 되는 것은 텍스트 처리 —
  # `awk`·`sed`·`sort` 로 로그를 다듬는 일이고, 그것만으로도 물을 것이 많다.
  #
  # **왜 debian-slim 인가 (도구를 고르고 고정한다).**
  # 공식 `bash:5` 는 26MB 로 가볍지만 alpine 이라 `awk`·`sed`·`grep`·`sort` 가 전부
  # **busybox** 다. busybox 는 GNU 와 동작이 다르다 — `sed -i`, `\+` 같은 정규식 확장,
  # `sort -h`, `grep -P` 가 없거나 다르게 군다. **문제 지문이 도구의 동작을 전제하게 되므로**
  # 실무에서 쓰는 쪽(GNU)으로 고정한다. 값은 139MB 이고, 노드마다 한 번 받는 비용이다.
  # #394 가 아희 구현을 고르고 고정한 것과 같은 판단이다.
  #
  # 들어 있는 것: bash 5.2, GNU coreutils, GNU sed 4.9, GNU grep, mawk(=`awk`), findutils.
  # **없는 것: gawk·jq·curl·python.** `gensub` 같은 gawk 전용 함수는 쓸 수 없다.
  - id: "bash:5"
    label: "Bash 5"
    monacoLanguage: "shell"
    image: "debian:13-slim"
    digest: "sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258"
    sourceFile: "main.sh"
    run: ["bash", "main.sh"]
    template: |
      #!/usr/bin/env bash
      read -r a b
      echo $((a + b))

  # ── SQL ───────────────────────────────────────────────────────────────────
  # 문제마다 새 PostgreSQL 을 컨테이너 안에서 띄운다 (#60).
  #
  # 서버를 미리 띄워 두지 않는 이유: 제출끼리 같은 인스턴스를 나눠 쓰면 한 사람의
  # 쿼리가 다른 사람의 결과에 영향을 준다. 컨테이너와 함께 사라지는 편이 안전하다.
  #
  # user 가 70:70 인 이유: initdb 는 UID 가 /etc/passwd 에 없으면 거부한다.
  # 기본 계정(10001)은 postgres 이미지에 없다.
  - id: "sql:postgres16"
    label: "PostgreSQL 16"
    monacoLanguage: "sql"
    # 이 런타임은 SQL 문제에서만 고를 수 있다 (#60).
    problemKind: "JUDGE_SQL"
    image: "postgres:16-alpine"
    digest: "sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777"
    sourceFile: "query.sql"
    # PostgreSQL 을 띄우고 읽기 전용 롤을 만드는 스크립트. 실행기가 갖고 있다.
    harness: "sql"
    user: "70:70"
    run: ["sh", "run-sql.sh"]
    # 기동에 드는 시간 (#454). 문제의 시간 제한은 이것보다 넉넉해야 한다 —
    # 제한은 컨테이너 전체에 걸리므로 기동도 그 안에서 일어난다. 실측 0.4초.
    startupMs: 500
    template: |
      -- 여기에 SELECT 문을 작성하세요.
      SELECT 1 + 2;

  # MariaDB 문제 (#454). **SQL 은 방언이 있다** — 한 DB 만 있으면 "SQL 을 배웠다" 가
  # "PostgreSQL 을 배웠다" 가 된다.
  #
  # **MySQL 이 아니라 MariaDB 인 이유:** MySQL 8.4 는 이 샌드박스 안에서 초기화되지
  # 않는다. user namespace 재매핑(#130)이 켜지면 `mysqld --initialize` 가 데이터
  # 디렉터리를 만들지 못하고(errno 13), 셸이 만들어 준 빈 디렉터리도 거절한다.
  # MariaDB 는 초기화가 셸 스크립트라 그 단계가 없다. 목적은 **방언을 하나 더 들이는
  # 것**이고 둘은 그 목적에서 같으므로, 되는 쪽을 쓴다.
  #
  # 구조는 이미 여러 개를 받는다: `problemKind` 로 걸러지므로 같은 유형에 런타임을 더
  # 두면 목록에 함께 나온다. **막는 것은 하네스였다** — `run-sql.sh` 는 PostgreSQL
  # 전용이라 DB 마다 하나씩 필요하다 (`run-mysql.sh`).
  #
  # **문제 하나에 DB 하나다.** 같은 문제를 여러 DB 로 풀게 하면 스키마와 정답 쿼리가
  # DB 마다 있어야 하는데(스펙이 DB 마다 하나), 그것은 #419 의 허용 목록으로 문제를
  # 묶는 편이 단순하다.
  #
  # user 가 999:999 인 이유: 서버가 데이터 디렉터리의 주인으로 돌아야 한다.
  # Oracle 은 넣지 않는다 — 공식 이미지가 무료 재배포를 제한하는데 우리는 미러링(#96)한다.
  - id: "sql:mariadb11"
    label: "MariaDB 11"
    monacoLanguage: "sql"
    problemKind: "JUDGE_SQL"
    image: "mariadb:11"
    digest: "sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf"
    sourceFile: "query.sql"
    harness: "mariadb"
    user: "999:999"
    run: ["sh", "run-mariadb.sh"]
    # **기동 비용이 DB 마다 다르다** (#454). 초기화 스크립트가 대부분을 쓴다 —
    # 실측 3.5초로 PostgreSQL(0.4초)의 여덟 배다. 문제의 시간 제한이 이보다 빠듯하면
    # 어떤 쿼리를 내도 시간 초과가 되므로, API 가 등록할 때 막는다.
    startupMs: 3500
    template: |
      -- 여기에 SELECT 문을 작성하세요.
      SELECT 1 + 2;

  # ── 인터랙티브 ─────────────────────────────────────────────────────────────
  # 채점 코드와 **도는 중에 주고받는** 문제 (#474). 스페셜 저지(#452)는 끝난 뒤 출력을
  # 받아 판정하지만, 여기서는 둘이 동시에 돌며 서로에게 쓴다.
  #
  # **파이썬으로 시작한다.** 둘이 같은 컨테이너 안에서 동시에 돌아야 하는데 컨테이너
  # 이미지는 제출 언어의 것이다 — 자바 이미지에는 파이썬이 없다. 컨테이너 둘을 파이프로
  # 잇는 것은 실행기의 실행 모델(한 번에 하나)을 바꾸는 일이라 따로 둔다.
  # #394 가 아희·엄랭 전용 문제로 같은 방식(언어를 묶는 것)의 전례를 만들었다.
  #
  # 제출을 `python3 -u`(버퍼 없음)로 돌린다 — flush 를 잊는 것이 이 유형에서 가장 흔한
  # 오답 원인이고, **사용자 잘못이지만 사용자가 알기 어렵다.**
  - id: "interactive:python3.13"
    label: "Python 3.13 (인터랙티브)"
    monacoLanguage: "python"
    problemKind: "JUDGE_INTERACTIVE"
    image: "python:3.13-alpine"
    digest: "sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d"
    sourceFile: "main.py"
    harness: "interactive"
    run: ["sh", "run-interactive.sh"]
    template: |
      import sys

      # 물을 때마다 flush 하세요. 안 하면 상대에게 영원히 닿지 않습니다.
      low, high = 1, 100
      while True:
          mid = (low + high) // 2
          print(mid, flush=True)
          answer = sys.stdin.readline().strip()
          if answer == "correct":
              break
          if answer == "higher":
              low = mid + 1
          else:
              high = mid - 1

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Redis 문제 (#455). **채점 모델이 SQL 과 다르다** — 제출이 쿼리 하나가 아니라
  # 명령의 연속이고, 남는 것은 결과 집합이 아니라 상태다. 그래서 유형이 따로 있다.
  #
  # **우리가 큐로 쓰는 Redis 와 절대 닿지 않는다** (ADR-0002). 하네스가 `--port 0` 으로
  # TCP 를 아예 열지 않고 유닉스 소켓만 쓴다 — 샌드박스가 네트워크를 끊지만(ADR-0003)
  # 같은 제품을 우리도 쓰기 때문에 한 겹만 믿지 않는다.
  #
  # Redis 부터인 이유: 기동이 가장 싸고(실측 0.4초) 명령이 단순하다. 채점 모델을
  # 먼저 세우고 MongoDB 를 얹는 편이 안전하다.
  - id: "redis:7"
    label: "Redis 7"
    monacoLanguage: "redis"
    problemKind: "JUDGE_REDIS"
    image: "redis:7-alpine"
    digest: "sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"
    sourceFile: "commands.redis"
    harness: "redis"
    user: "999:999"
    run: ["sh", "run-redis.sh"]
    startupMs: 500
    template: |
      # 여기에 명령을 한 줄에 하나씩 쓰세요.
      INCRBY sum 3

  # 정규식 (#653).
  #
  # **새 이미지를 만들지 않는다.** 이미 등록된 파이썬을 그대로 쓴다 — #588 이 겪은
  # "레지스트리에 없는 이미지" 를 늘리지 않기 위해서다. 하네스와 진입 파일만 다르다.
  #
  # **제출은 코드가 아니라 패턴 한 줄이다.** 하네스가 그것을 실행하지 않고 파일에서
  # 읽어 엔진에 넘긴다 — 실행했다가는 제출이 곧 임의 코드 실행이 된다.
  #
  # 엔진을 파이썬 `re` 로 두는 이유: 배우려는 사람이 실제로 만나는 것이 PCRE 계열이고,
  # 전방 탐색·역참조가 없으면 낼 수 없는 문제가 많다. 대가는 재앙적 백트래킹인데,
  # 그것은 **시간 제한이 잡는다** — 그 패턴은 실제로 느리므로 정확한 답이다.
  - id: "regex:python"
    label: "정규식 (Python re)"
    # Monaco 에 정규식 모드가 없다. 강조 없이 그대로 보여 준다 — 패턴에 색을 잘못
    # 칠하면 없는 문법이 있는 것처럼 읽힌다.
    monacoLanguage: "plaintext"
    problemKind: "JUDGE_REGEX"
    image: "python:3.13-alpine"
    digest: "sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d"
    sourceFile: "pattern.txt"
    harness: "regex"
    run: ["sh", "run-regex.sh"]
    startupMs: 200
    template: |
      ^[a-z]+$

  # Git (#654).
  #
  # **새 이미지를 만들지 않는다.** C/C++ 이 쓰는 `gcc:13` 에 git 이 들어 있다
  # (2.39.5, 확인함) — #588 이 겪은 "레지스트리에 없는 이미지" 를 늘리지 않는다.
  # 큰 이미지지만 **이미 모든 노드에 있다.**
  #
  # 하네스가 하는 일이 다른 것보다 많다: 커밋 해시가 재현되도록 **신원과 시각을 고정**하고
  # (안 하면 같은 답이 때에 따라 틀린다), 네트워크 명령이 타임아웃이 아니라 **즉시**
  # 거부되게 한다(`protocol.allow=never`).
  - id: "git:2"
    label: "Git"
    # Monaco 에 git 명령 모드가 없다. 셸로 강조하면 `git` 다음이 색이 갈려 읽기 낫다.
    monacoLanguage: "shell"
    problemKind: "JUDGE_GIT"
    image: "gcc:13"
    digest: "sha256:ad3bd9a25f8495c0d2830d9fdd15c6ce889ada806bc1a00f611f22411a1f8b7c"
    sourceFile: "commands.git"
    harness: "git"
    run: ["sh", "run-git.sh"]
    startupMs: 300
    template: |
      # 한 줄에 명령 하나씩 씁니다. git 명령만 쓸 수 있습니다.
      git log --oneline

  # MongoDB (#527).
  #
  # **Redis 와 유형을 나눴다.** 질의 언어가 아예 다르기 때문이다 — #454 가 SQL 에
  # MariaDB 를 더할 때는 런타임만 얹으면 됐지만(같은 언어) 여기는 스펙 표부터 갈린다.
  #
  # **기동이 비싸다.** Redis 가 0.4초인 자리에서 mongod 는 수 초가 걸린다. 그래서
  # 하네스가 서버를 하나만 띄우고 **데이터베이스로** 기대/실제를 나눈다 — Redis 는
  # ACL 이 번호 DB 를 못 갈라 서버를 둘 띄웠지만, MongoDB 의 권한은 DB 단위다.
  - id: "mongodb:7"
    label: "MongoDB 7"
    # Monaco 가 mongosh 를 모른다. 스크립트가 자바스크립트이므로 그것으로 강조한다.
    monacoLanguage: "javascript"
    problemKind: "JUDGE_MONGODB"
    image: "mongo:7"
    digest: ""
    sourceFile: "query.mongo"
    harness: "mongo"
    run: ["sh", "run-mongo.sh"]
    # **샌드박스 안에서 재야 한다.** 하네스만 따로 돌리면 2.6초인데, 샌드박스를 지나면
    # 10초를 넘겼다(실측 10.4초) — mongosh 를 네 번 띄우는 값이 그만큼 크다.
    # 넉넉히 12초로 잡는다. 짧게 잡으면 제출이 아무리 빨라도 시간 초과가 난다.
    startupMs: 12000
    template: |
      // 여기에 mongosh 스크립트를 쓰세요.
      db.stocks.updateOne({ sku: "A-1" }, { $inc: { qty: 5 } });

  # ── 난해한 언어 (#394) ─────────────────────────────────────────────────────
  #
  # **문제를 푸는 방법이 아니라 언어 자체가 놀이인 쪽**이다. 하나라도 있으면 같은
  # 문제를 다시 풀 이유가 생긴다.
  #
  # 둘 다 공식 이미지가 없어 직접 만든다 (infra/runtimes/images/).
  # 그리고 둘 다 **JIT 없는 순수 파이썬 인터프리터**라 느리다 — 실행 제한을 따로 준다(#97).
  - id: "aheui:1.2"
    label: "아희 (pyaheui 1.2)"
    # Monaco 가 이 언어를 모른다. 문법 강조가 없는 편이 **틀린 강조보다 낫다.**
    monacoLanguage: "plaintext"
    image: "codekr-runtime-aheui:1.2"
    sourceFile: "main.aheui"
    run: ["aheui", "main.aheui"]
    # **도는 프로그램 하나를 둔다.** 아희는 빈 화면에서 시작하기가 특히 어렵다 —
    # 한글 음절 자체가 코드라 무엇을 쳐야 할지조차 알기 어렵다. 공식 예제의
    # "안녕하세요?" 를 그대로 뒀다 (aheui/snippets).
    template: |
      어듀벊벖버범벅벖떠벋벍떠벑번뻐버떠뻐벚벌버더벊벖떠벛벜버버
      　ㅇ　　ㅏㄴㄴㅕㅇ　　ㅎ　　ㅏ　ㅅ　　ㅔ　ㅇ　　ㅛ　　　\0
      　뿌멓더떠떠떠떠더벋떠벌뻐뻐뻐
      붉차밠밪따따다밠밨따따다　박봃
      받빠따따맣반발따맣아희～
  - id: "umjunsik:1.0"
    label: "엄랭 (umjunsik-lang)"
    monacoLanguage: "plaintext"
    image: "codekr-runtime-umjunsik:1.0"
    sourceFile: "main.umm"
    run: ["python", "-m", "umjunsik", "main.umm"]
    # 두 수를 읽어 더해 출력한다. **빈 화면에서 시작하기가 특히 어려운 언어**라,
    # 도는 프로그램 하나를 두는 것이 시작 코드의 값이다 (저장소의 예제에서 가져왔다).
    template: |
      어떻게
      
      엄식?
      어엄식?
      
      동탄어?준... ....
      
      엄어,
      어엄어어.
      
      준.. ...
      식어어!
      
      이 사람이름이냐ㅋㅋ
