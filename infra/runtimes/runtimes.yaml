  - id: "c:17"
    label: "C17 (GCC 13)"
    monacoLanguage: "c"
    image: "gcc:13"
    digest: "sha256:ad3bd9a25f8495c0d2830d9fdd15c6ce889ada806bc1a00f611f22411a1f8b7c"
    sourceFile: "main.c"
    compile: ["sh", "-c", "gcc -O2 -std=c17 -o main *.c -lm"]
    run: ["./main"]
    template: |
      #include <stdio.h>

      int main(void) {
          long long a, b;
          if (scanf("%lld %lld", &a, &b) != 2) return 0;
          printf("%lld\n", a + b);
          return 0;
      }
    # 함수형 문제 (#421, #616).
    #
    # **컴파일 명령을 따로 두지 않는다** — 위의 `gcc ... *.c` 가 이미 디렉터리의
    # `.c` 를 통째로 먹으므로, 하네스(`main.c`)와 사용자 코드(`solution.c`)가 그대로
    # 함께 컴파일된다. 하네스는 함수를 **선언**하고 사용자는 **정의**한다.
    #
    # 실행 전에 `.c` 를 지운다. 그러지 않으면 사용자 코드가 `fopen("main.c")` 로
    # 하네스를 그대로 읽을 수 있다 — 파이썬이 로더에서 하는 일과 같은 이유이고,
    # 방법만 언어를 따른다. 컴파일이 끝난 뒤라 지워도 실행에는 지장이 없다.
    functionHarness:
      file: "main.c"
      # 하네스가 진입점(`main`)을 가져가므로 사용자 코드는 옆에 놓인다.
      sourceFile: "solution.c"
      run: ["sh", "-c", "rm -f ./*.c && exec ./main"]

  # ── JVM ───────────────────────────────────────────────────────────────────
  # 클래스 이름을 Main 으로 고정한다 — 파일명과 public 클래스 이름이 같아야 하기 때문이다.
  - id: "java:21"
    label: "Java 21"
    monacoLanguage: "java"
    image: "eclipse-temurin:21-jdk-alpine"
    digest: "sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76"
    sourceFile: "Main.java"
    compile: ["javac", "Main.java"]
    run: ["java", "-XX:+UseSerialGC", "-Xss64m", "Main"]
    template: |
      import java.io.*;
      import java.util.*;

      public class Main {
          public static void main(String[] args) throws IOException {
              StreamTokenizer in = new StreamTokenizer(new BufferedInputStream(System.in));
              in.nextToken(); long a = (long) in.nval;
              in.nextToken(); long b = (long) in.nval;
              System.out.println(a + b);
          }
      }

