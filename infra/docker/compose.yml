name: codekr

# 빌드 컨텍스트는 모두 저장소 루트다 — libs/gocontract 와 infra/runtimes 를 공유하기 때문이다.
x-build-context: &build-context ../..

services:
  postgres:
    image: postgres:16-alpine
    container_name: codekr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codekr}
      POSTGRES_USER: ${POSTGRES_USER:-codekr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codekr_local_pw}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codekr} -d ${POSTGRES_DB:-codekr}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [codekr]

  redis:
    image: redis:7-alpine
    container_name: codekr-redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [codekr]

  # 사용자가 올린 이미지를 두는 곳 (#115).
  #
  # **클라우드 계정 없이 전체가 돌아야 한다.** 로컬에서만 다른 저장 방식을 쓰면
  # 로컬에서 되던 것이 운영에서 안 되는 일이 생기고, 그때 원인을 찾기 어렵다.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: codekr-storage
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-codekr}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-codekr_local_pw}
    ports:
      - "${STORAGE_HOST_PORT:-19000}:9000"
      - "${STORAGE_CONSOLE_PORT:-19001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [codekr]

  # 모델 제공자 앞에 서는 프록시 (#648).
  #
  # **기본으로 뜨지 않는다.** `profiles` 가 붙어 있어 `make up` 은 이것을 건너뛴다 —
  # 초안 만들기는 키가 있어야 쓸 수 있고, 키가 없는 사람에게 뜨지 않는 컨테이너 하나가
  # 늘 실패해 보이는 것은 나쁘다. 켜려면:
  #
  #     docker compose --profile ai up -d litellm
  #
  # **api 는 이것이 있든 없든 그대로 뜬다.** `CODEKR_DRAFT_BASE_URL` 을 여기로 돌리는
  # 것은 `.env` 에서 하는 일이고, 안 돌리면 기본값(OpenAI)으로 간다.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.77.3-stable
    container_name: codekr-litellm
    profiles: [ai]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # **제공자 키는 여기만 안다.** api 는 아래 master key 만 들고 부른다 —
      # 새면 그것만 돌리면 되고, 제공자 계정 전체가 열리지 않는다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-codekr-local}
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_HOST_PORT:-14000}:4000"
    healthcheck:
      # `/health/liveliness` 는 키 없이도 답한다 — 제공자에 붙어 보지 않는다.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [codekr]

  api:
    build:
      context: *build-context
      dockerfile: apps/api/Dockerfile
    container_name: codekr-api
    environment:
      CODEKR_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codekr}
      CODEKR_DB_USERNAME: ${POSTGRES_USER:-codekr}
      CODEKR_DB_PASSWORD: ${POSTGRES_PASSWORD:-codekr_local_pw}
      CODEKR_REDIS_HOST: redis
      CODEKR_REDIS_PORT: 6379
      CODEKR_JWT_SECRET: ${CODEKR_JWT_SECRET:-local-development-only-secret-change-me-please-32b}
      CODEKR_JWT_ACCESS_TTL_SECONDS: ${CODEKR_JWT_ACCESS_TTL_SECONDS:-3600}
      CODEKR_JWT_REFRESH_TTL_SECONDS: ${CODEKR_JWT_REFRESH_TTL_SECONDS:-1209600}
      CODEKR_CORS_ALLOWED_ORIGINS: ${CODEKR_CORS_ALLOWED_ORIGINS:-http://localhost:13000}
      # 로컬은 켜 둔다 (#285). 기능을 붙이고 시험 데이터를 넣고 다시 비우는 일이 반복된다.
      # **배포에서는 기본이 꺼짐이다** — 운영을 시작하는 날 그대로 두면 된다.
      CODEKR_DATA_RESET_ENABLED: ${CODEKR_DATA_RESET_ENABLED:-true}
      # 메일 (#233). **기본은 비어 있다** — 비우면 보내지 않고 로그에 본문을 찍는다.
      # 로컬에서 실제 발송까지 보려면 메일 싱크(mailpit 등)를 띄우고 이 값을 준다.
      CODEKR_MAIL_HOST: ${CODEKR_MAIL_HOST:-}
      CODEKR_MAIL_PORT: ${CODEKR_MAIL_PORT:-587}
      CODEKR_MAIL_SSL: ${CODEKR_MAIL_SSL:-false}
      CODEKR_MAIL_USERNAME: ${CODEKR_MAIL_USERNAME:-}
      CODEKR_MAIL_PASSWORD: ${CODEKR_MAIL_PASSWORD:-}
      CODEKR_MAIL_FROM: ${CODEKR_MAIL_FROM:-no-reply@xn--hy1by51c.kr}
      # 문제 초안 만들기 (#230). **비면 그 기능이 없다** — 부르면 404 다.
      CODEKR_DRAFT_BASE_URL: ${CODEKR_DRAFT_BASE_URL:-https://api.openai.com/v1}
      CODEKR_DRAFT_API_KEY: ${CODEKR_DRAFT_API_KEY:-}
      CODEKR_DRAFT_MODEL: ${CODEKR_DRAFT_MODEL:-gpt-4o-mini}
      CODEKR_SITE_URL: ${CODEKR_SITE_URL:-http://localhost:13000}
      # 오브젝트 스토리지 (#115). 운영은 S3 호환, 로컬은 MinIO — **같은 코드 경로**다.
      CODEKR_STORAGE_ENDPOINT: http://storage:9000
      CODEKR_STORAGE_BUCKET: ${STORAGE_BUCKET:-codekr}
      CODEKR_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-codekr}
      CODEKR_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-codekr_local_pw}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    networks: [codekr]

  executor:
    build:
      context: *build-context
      dockerfile: apps/executor/Dockerfile
    container_name: codekr-executor
    environment:
      CODEKR_REDIS_ADDR: redis:6379
      CODEKR_HTTP_ADDR: ":8081"
      CODEKR_RUNTIMES_PATH: /etc/codekr/runtimes.yaml
      EXECUTOR_CONCURRENCY: ${EXECUTOR_CONCURRENCY:-4}
      EXECUTOR_COMPILE_TIMEOUT_MS: ${EXECUTOR_COMPILE_TIMEOUT_MS:-15000}
      EXECUTOR_COMPILE_MEMORY_MB: ${EXECUTOR_COMPILE_MEMORY_MB:-1024}
      EXECUTOR_MAX_OUTPUT_BYTES: ${EXECUTOR_MAX_OUTPUT_BYTES:-65536}
    ports:
      - "${EXECUTOR_HOST_PORT:-18081}:8081"
    volumes:
      # 샌드박스를 형제 컨테이너로 띄우기 위한 소켓. 실행 전용 노드에서만 허용한다 (ADR-0003).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [codekr]

  judge:
    build:
      context: *build-context
      dockerfile: apps/judge/Dockerfile
    container_name: codekr-judge
    environment:
      CODEKR_REDIS_ADDR: redis:6379
      CODEKR_HTTP_ADDR: ":8082"
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-4}
      JUDGE_EXEC_TIMEOUT_MS: ${JUDGE_EXEC_TIMEOUT_MS:-60000}
    ports:
      - "${JUDGE_HOST_PORT:-18082}:8082"
    depends_on:
      redis: { condition: service_healthy }
      executor: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [codekr]

  judge-contest:
    build:
      context: *build-context
      dockerfile: apps/judge/Dockerfile
    container_name: codekr-judge-contest
    environment:
      CODEKR_REDIS_ADDR: redis:6379
      CODEKR_HTTP_ADDR: ":8082"
      # 대회 제출만 읽는다 (#62). 일반 큐와 워커를 나눠야 대회가 밀리지 않는다.
      CODEKR_JUDGE_LANE: contest
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-4}
      JUDGE_EXEC_TIMEOUT_MS: ${JUDGE_EXEC_TIMEOUT_MS:-60000}
    ports:
      - "${JUDGE_CONTEST_HOST_PORT:-18083}:8082"
    depends_on:
      redis: { condition: service_healthy }
      executor: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [codekr]

  web:
    build:
      context: *build-context
      dockerfile: apps/web/Dockerfile
      args:
        # **비워 둔다** — 운영과 같이 같은 출처로 부른다 (#314). web 의 rewrite 가
        # `/api` 를 api 컨테이너로 넘긴다. 여기에 주소를 박으면 `<img src>` 처럼
        # 접두사가 닿지 않는 자리에서 다시 어긋난다.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        # 웹소켓은 rewrite 로 넘어가지 않으므로 그대로 호스트 주소를 준다.
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:18080}
        # rewrite 가 넘길 곳. **build args 다** — Next 가 빌드 때 굳힌다.
        API_INTERNAL_BASE_URL: http://api:8080
    container_name: codekr-web
    environment:
      # sitemap 이 서버에서 문제 목록을 받아 올 주소 (#271).
      # 위의 build args 와 달리 **컨테이너 이름**이다 — 브라우저가 아니라 web 컨테이너가 부른다.
      API_INTERNAL_BASE_URL: http://api:8080
    ports:
      - "${WEB_HOST_PORT:-13000}:3000"
    depends_on:
      api: { condition: service_started }
    networks: [codekr]

volumes:
  postgres-data:
  redis-data:
  storage-data:

networks:
  codekr:
    name: codekr
